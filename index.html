      '</div>' +
      '<div class="pptg-status"><span data-h="status">Diapositive 1 sur 10</span><span>Français (France)</span><span class="pptg-status-r">Échap : pause · 🗒 Notes · ▦ ▤ ▶ · 100 %</span></div>' +
      '<div class="pptg-pause"><div class="pptg-panel small"><h2>⏸ Pause</h2><p>Le chrono est arrêté.</p><div class="pptg-row"><button class="pptg-btn" data-a="resume">Reprendre (Échap)</button><button class="pptg-btn ghost" data-a="abandon">Abandonner la partie</button></div></div></div>';

    var $ = function (s) { return board.querySelector(s); };
    var hud = {};
    board.querySelectorAll('[data-h]').forEach(function (e) { hud[e.getAttribute('data-h')] = e; });
    var slide = $('.pptg-slide');
    var thumbs = $('.pptg-thumbs');
    var pauseEl = $('.pptg-pause');

    // mise à l'échelle de la planche 1280x720 dans le conteneur
    function fit() {
      var w = root.clientWidth, h = root.clientHeight;
      if (!w || !h) return;
      var s = Math.min(w / W, h / H);
      board.style.transform = 'translate(' + Math.round((w - W * s) / 2) + 'px,' + Math.round((h - H * s) / 2) + 'px) scale(' + s + ')';
    }
    var ro = null;
    if (window.ResizeObserver) { ro = new ResizeObserver(fit); ro.observe(root); }
    window.addEventListener('resize', fit);
    fit();

    // pas de menu contextuel ni de sélection dans la zone de jeu
    function noContext(e) { e.preventDefault(); }
    root.addEventListener('contextmenu', noContext);

    // ---------- état ----------
    var screen = 'home';
    var questions = [], qi = -1, q = null;
    var score = 0, combo = 1, details = [];
    var raf = 0, paused = false, pauseStart = 0, pausedTotal = 0;
    var held = { ctrl: false, shift: false, alt: false };
    var blocking = false, destroyed = false, keyboardLocked = false;
    var lastTickSec = -1;

    function now() { return performance.now() - pausedTotal; }

    // ======================================================================
    //  Neutralisation du clavier (uniquement pendant la partie et le test)
    // ======================================================================
    function onKeyDown(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      updateHeld(e, true);
      if (e.key === 'Escape') { if (screen === 'playing') togglePause(); else if (screen === 'test') showHome(); return; }
      if (paused || e.repeat) return;
      var c = eventCombo(e);
      if (!c) return; // Ctrl, Maj, Alt seuls : ignorés
      if (screen === 'playing') handleCombo(c);
      else if (screen === 'test') handleTest(c);
    }
    function onKeyUp(e) {
      e.preventDefault(); // Alt relâché seul ouvrirait la barre de menus de certains navigateurs
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      updateHeld(e, false);
    }
    function swallow(e) { e.preventDefault(); e.stopPropagation(); }
    function onBlur() { held = { ctrl: false, shift: false, alt: false }; renderHeld(); }

    function setBlocking(on) {
      if (on === blocking) return;
      blocking = on;
      var o = { capture: true };
      var fn = on ? 'addEventListener' : 'removeEventListener';
      window[fn]('keydown', onKeyDown, o);
      window[fn]('keyup', onKeyUp, o);
      window[fn]('keypress', swallow, o);
      window[fn]('blur', onBlur);
      root.classList.toggle('pptg-capturing', on);
    }

    function updateHeld(e, down) {
      var k = e.key;
      if (k === 'Control' || k === 'Meta') held.ctrl = down;
      else if (k === 'Shift') held.shift = down;
      else if (k === 'Alt' || k === 'AltGraph') held.alt = down;
      else {
        held.ctrl = !!(e.ctrlKey || e.metaKey);
        held.shift = !!e.shiftKey;
        held.alt = !!e.altKey;
      }
      renderHeld();
    }

    // Bonus : plein écran + Keyboard Lock (Chrome / Edge)
    var canLock = !!(navigator.keyboard && navigator.keyboard.lock && document.documentElement.requestFullscreen);
    function enterLockMode() {
      var p = root.requestFullscreen ? root.requestFullscreen() : document.documentElement.requestFullscreen();
      return Promise.resolve(p).then(function () {
        return navigator.keyboard.lock();
      }).then(function () { keyboardLocked = true; }).catch(function () { keyboardLocked = false; });
    }
    function exitLockMode() {
      try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) { /* ignoré */ }
      keyboardLocked = false;
    }

    // ======================================================================
    //  Écran d'accueil
    // ======================================================================
    function showHome() {
      stopLoop();
      setBlocking(false);
      screen = 'home';
      resetHud();
      renderThumbs();
      var problems = loaded.errors.length
        ? '<div class="pptg-alert">⚠ Banque de raccourcis incomplète :<br>' + loaded.errors.map(esc).join('<br>') + '</div>' : '';
      var excludedNote = loaded.excluded.length
        ? '<div class="pptg-info">' + loaded.excluded.length + ' entrée(s) exclue(s) de la banque (voir la console).</div>' : '';
      var touch = isTouchOnly()
        ? '<div class="pptg-alert">⌨️ Ce jeu se joue avec un <b>clavier physique</b>. Branche un clavier pour jouer.</div>' : '';
      slide.className = 'pptg-slide home';
      slide.innerHTML =
        '<div class="pptg-home">' +
        '<div class="pptg-kicker">PowerPoint × jeu de rythme</div>' +
        '<h1>Raccourcis <span>Hero</span></h1>' +
        '<ol class="pptg-rules">' +
        '<li><b>10 actions PowerPoint</b> s\'affichent : tape le raccourci de mémoire en <b>10 s</b>.</li>' +
        '<li>Raté ? Le raccourci tombe sur la ligne : tu as encore <b>5 s</b> (moins de points).</li>' +
        '<li>Enchaîne les réussites à l\'aveugle pour faire <b>flamber le combo</b> (jusqu\'à ×2).</li>' +
        '</ol>' + touch + problems + excludedNote +
        '<div class="pptg-row">' +
        '<button class="pptg-btn big" data-a="play"' + (loaded.errors.length ? ' disabled' : '') + '>▶ Jouer</button>' +
        (canLock ? '<button class="pptg-btn ghost" data-a="lock" title="Chrome / Edge : capture encore plus de combinaisons">⛶ Plein écran + verrouillage clavier</button>' : '') +
        '</div>' +
        '<div class="pptg-row small">' +
        '<button class="pptg-link" data-a="test">🧪 Tester les raccourcis sur ce navigateur</button>' +
        (opts.onQuit ? '<button class="pptg-link" data-a="quit">✕ Quitter</button>' : '') +
        '</div>' +
        '<div class="pptg-foot">AZERTY et QWERTY · Cmd = Ctrl sur Mac · Échap = pause</div>' +
        '</div>';
      bind(slide, 'play', function () { start(); });
      bind(slide, 'lock', function () { enterLockMode().then(start); });
      bind(slide, 'test', showTest);
      bind(slide, 'quit', function () { if (opts.onQuit) opts.onQuit(); });
    }

    function bind(scope, action, fn) {
      var b = scope.querySelector('[data-a="' + action + '"]');
      if (b) b.addEventListener('click', function (e) { e.preventDefault(); b.blur(); fn(); });
    }

    // ======================================================================
    //  Partie
    // ======================================================================
    function pickQuestions() {
      var list = [];
      cfg.levelOrder.forEach(function (lvl) {
        shuffle(loaded.pools[lvl]).slice(0, cfg.levels[lvl].count).forEach(function (entry) { list.push(entry); });
      });
      return list;
    }

    function start() {
      if (destroyed || loaded.errors.length) return;
      stopLoop();
      questions = pickQuestions();
      qi = -1; score = 0; combo = 1; details = [];
      paused = false; pausedTotal = 0;
      pauseEl.classList.remove('show');
      screen = 'playing';
      setBlocking(true);
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      renderThumbs();
      updateHud();
      nextQuestion();
      raf = requestAnimationFrame(loop);
    }

    function nextQuestion() {
      qi++;
      if (qi >= questions.length) { endGame(); return; }
      var entry = questions[qi];
      var lvl = cfg.levels[entry.level];
      q = {
        entry: entry, coef: lvl.coef, levelLabel: lvl.label,
        phase: 'intro', step: 0, until: now() + cfg.timing.intro * 1000, deadline: 0
      };
      lastTickSec = -1;
      renderQuestion();
      renderThumbs();
      updateHud();
    }

    function startPhase(p) {
      q.phase = p;
      var dur = (p === 'p1' ? cfg.timing.phase1 : cfg.timing.phase2) * 1000;
      q.deadline = now() + dur;
      q.duration = dur;
      lastTickSec = -1;
      slide.classList.remove('intro');
      slide.classList.toggle('revealed', p === 'p2');
      setPhaseText();
      renderNotes(p === 'p2');
      if (p === 'p2') sfx('alarm');
    }

    function loop() {
      if (destroyed || screen !== 'playing') return;
      if (!paused && q) {
        var t = now();
        if (q.phase === 'intro' && t >= q.until) startPhase('p1');
        else if (q.phase === 'p1' || q.phase === 'p2') {
          var left = Math.max(0, q.deadline - t);
          renderTimer(left / q.duration, left / 1000);
          var sec = Math.ceil(left / 1000);
          if (q.phase === 'p2' && sec !== lastTickSec && sec <= 3 && sec > 0) { lastTickSec = sec; sfx('tick'); }
          if (left <= 0) {
            if (q.phase === 'p1') startPhase('p2');
            else miss();
          }
        } else if ((q.phase === 'success' || q.phase === 'missed') && t >= q.until) {
          nextQuestion();
        }
      }
      raf = requestAnimationFrame(loop);
    }
    function stopLoop() { cancelAnimationFrame(raf); raf = 0; }

    // ---------- reconnaissance d'une combinaison ----------
    function handleCombo(c) {
      if (!q || (q.phase !== 'p1' && q.phase !== 'p2')) return;
      var combos = q.entry.combos;
      showTyped(c);
      if (sameCombo(c, combos[q.step])) {
        q.step++;
        if (q.step >= combos.length) succeed();
        else { sfx('pop'); stepDone(); }
        return;
      }
      // mauvaise combinaison : on ne perd pas la question, mais un enchaînement repart du début
      var restart = combos.length > 1 && q.step > 0 && sameCombo(c, combos[0]);
      q.step = restart ? 1 : 0;
      wrong(c);
    }

    function succeed() {
      var left = Math.max(0, q.deadline - now()) / 1000;
      var pts, phase = q.phase, usedCombo = combo;
      if (phase === 'p1') {
        var s1 = cfg.scoring.phase1;
        pts = (s1.base + s1.speed * left / cfg.timing.phase1) * q.coef * combo;
        combo = Math.min(cfg.scoring.comboMax, combo + cfg.scoring.comboStep);
      } else {
        var s2 = cfg.scoring.phase2;
        pts = (s2.base + s2.speed * left / cfg.timing.phase2) * q.coef;
        combo = 1;
        usedCombo = 1;
      }
      pts = Math.round(pts);
      score += pts;
      details.push({
        index: qi + 1, action: q.entry.label, level: q.entry.level, shortcut: q.entry.text,
        result: phase === 'p1' ? 'phase1' : 'phase2', points: pts, combo: usedCombo,
        time: Math.round((q.duration - left * 1000) / 100) / 10
      });
      q.phase = 'success';
      q.until = now() + cfg.timing.afterSuccess * 1000;
      sfx(phase === 'p1' ? 'ding' : 'pop');
      if (phase === 'p1' && combo >= 1.75) sfx('promo');
      renderNotes(true, 'success');
      flash('ok');
      popup('+' + fmt(pts), phase === 'p1' ? (usedCombo > 1 ? 'PARFAIT ! ' + fmtCoef(usedCombo) : 'PARFAIT !') : 'De justesse !');
      renderThumbs();
      updateHud(true);
    }

    function miss() {
      combo = 1;
      details.push({
        index: qi + 1, action: q.entry.label, level: q.entry.level, shortcut: q.entry.text,
        result: 'missed', points: 0, combo: 1, time: null
      });
      q.phase = 'missed';
      q.until = now() + cfg.timing.showAnswer * 1000;
      sfx('error');
      renderTimer(0, 0);
      renderNotes(true, 'missed');
      flash('ko');
      popup('0 pt', 'Raté… la réponse était : ' + q.entry.text);
      renderThumbs();
      updateHud();
    }

    function wrong(c) {
      sfx('error');
      flash('ko');
      slide.classList.remove('shake');
      void slide.offsetWidth;
      slide.classList.add('shake');
      renderNotes(q.phase === 'p2');
    }

    function stepDone() {
      renderNotes(q.phase === 'p2');
      var line = slide.querySelector('.pptg-line');
      if (line) { line.classList.remove('hit'); void line.offsetWidth; line.classList.add('hit'); }
    }

    function togglePause() {
      if (screen !== 'playing') return;
      paused = !paused;
      if (paused) { pauseStart = performance.now(); pauseEl.classList.add('show'); }
      else { pausedTotal += performance.now() - pauseStart; pauseEl.classList.remove('show'); }
    }
    bind(pauseEl, 'resume', togglePause);
    bind(pauseEl, 'abandon', function () { togglePause(); showHome(); });

    function endGame() {
      stopLoop();
      screen = 'end';
      setBlocking(false);
      exitLockMode();
      q = null;
      renderThumbs();
      updateHud();
      renderEnd();
      sfx('win');
      var result = { score: score, details: details.slice() };
      if (typeof opts.onGameEnd === 'function') {
        try { opts.onGameEnd(result); } catch (e) { if (window.console) console.error(e); }
      }
    }

    // ======================================================================
    //  Rendu
    // ======================================================================
    function resetHud() {
      hud.score.textContent = '0';
      hud.combo.textContent = '×1';
      hud.qnum.textContent = '–/10';
      hud.combobox.className = 'pptg-hud-box combo';
      hud.status.textContent = 'Diapositive 1 sur ' + totalQuestions();
    }
    function totalQuestions() {
      return cfg.levelOrder.reduce(function (n, l) { return n + cfg.levels[l].count; }, 0);
    }

    function updateHud(bump) {
      var n = totalQuestions();
      hud.score.textContent = fmt(score);
      hud.combo.textContent = fmtCoef(combo);
      var cur = Math.min(n, Math.max(1, qi + 1));
      hud.qnum.textContent = (screen === 'playing' ? cur : n) + '/' + n;
      hud.status.textContent = 'Diapositive ' + cur + ' sur ' + n + ' · Score ' + fmt(score) + ' · Combo ' + fmtCoef(combo);
      var heat = combo >= 2 ? 'max' : combo >= 1.5 ? 'hot' : combo > 1 ? 'warm' : '';
      hud.combobox.className = 'pptg-hud-box combo ' + heat;
      if (bump) {
        hud.score.classList.remove('bump'); void hud.score.offsetWidth; hud.score.classList.add('bump');
      }
    }

    function renderThumbs() {
      var n = totalQuestions(), out = '';
      for (var i = 0; i < n; i++) {
        var d = details[i];
        var st = d ? d.result : (screen === 'playing' && i === qi ? 'current' : 'todo');
        var lvl = questions[i] ? questions[i].level : cfg.levelOrder[i < 3 ? 0 : i < 7 ? 1 : 2];
        out += '<div class="pptg-thumb ' + st + ' lv-' + lvl + '"><span>' + (i + 1) + '</span><div class="pptg-mini">' +
          (d ? (d.result === 'missed' ? '✕' : '✓') : (st === 'current' ? '…' : '')) + '</div></div>';
      }
      thumbs.innerHTML = out;
    }

    function renderQuestion() {
      var e = q.entry, chain = e.combos.length > 1;
      slide.className = 'pptg-slide play intro lv-' + e.level;
      slide.innerHTML =
        '<div class="pptg-qhead"><span class="pptg-level">' + q.levelLabel + ' · ' + fmtCoef(q.coef) + '</span>' +
        '<span class="pptg-qn">Question ' + (qi + 1) + ' / ' + totalQuestions() + '</span></div>' +
        '<div class="pptg-action">' + esc(e.label) + '</div>' +
        '<div class="pptg-phase"></div>' +
        '<div class="pptg-timer"><i></i><b></b></div>' +
        '<div class="pptg-track' + (chain ? ' chain' : '') + '"><div class="pptg-lanes"></div><div class="pptg-notes"></div><div class="pptg-line"></div>' +
        (chain ? '<div class="pptg-steps"></div>' : '') + '</div>' +
        '<div class="pptg-held"><span class="pptg-cap mod" data-m="ctrl">Ctrl</span><span class="pptg-cap mod" data-m="shift">Maj</span><span class="pptg-cap mod" data-m="alt">Alt</span>' +
        '<span class="pptg-typed">Tape la combinaison…</span></div>' +
        '<div class="pptg-pop"></div>';
      setPhaseText();
      renderTimer(1, cfg.timing.phase1);
      renderNotes(false);
      renderHeld();
    }

    function setPhaseText() {
      var ph = slide.querySelector('.pptg-phase');
      if (!ph) return;
      var chain = q.entry.combos.length > 1;
      if (q.phase === 'intro') ph.innerHTML = 'Prépare-toi…';
      else if (q.phase === 'p1') ph.innerHTML = '🙈 <b>À l\'aveugle</b> · tape le raccourci de mémoire' + (chain ? ' (2 raccourcis, dans l\'ordre)' : '');
      else if (q.phase === 'p2') ph.innerHTML = '🎸 <b>Raccourci révélé</b> · vite, tape-le !';
    }

    function renderTimer(f, secLeft) {
      var t = slide.querySelector('.pptg-timer');
      if (!t) return;
      f = Math.max(0, Math.min(1, f));
      var i = t.querySelector('i');
      i.style.width = (f * 100) + '%';
      // du vert (120°) au rouge (0°)
      i.style.background = 'hsl(' + Math.round(120 * f) + ', 75%, 45%)';
      t.querySelector('b').textContent = secLeft.toFixed(1).replace('.', ',') + ' s';
      t.classList.toggle('urgent', f < 0.3);
    }

    function renderNotes(revealed, outcome) {
      var notes = slide.querySelector('.pptg-notes');
      if (!notes) return;
      var combos = q.entry.combos, chain = combos.length > 1;
      var html = '';
      combos.forEach(function (c, i) {
        var cls = 'pptg-note';
        var offset = (i - q.step) * 96; // le raccourci attendu est sur la ligne, le suivant au-dessus
        if (i < q.step) cls += ' done';
        if (outcome === 'success') cls += ' done';
        if (outcome === 'missed') cls += ' missed';
        if (!revealed) cls += ' blind';
        if (i === q.step && !outcome) cls += ' current';
        var content = revealed ? capsHTML(c) : '<span class="pptg-cap blind">?</span>';
        if (outcome === 'missed') offset = i * 96;
        html += '<div class="' + cls + '" style="bottom:' + (34 + Math.max(0, offset)) + 'px" data-i="' + i + '">' +
          (chain ? '<em>' + (i + 1) + '</em>' : '') + content + '</div>';
      });
      notes.innerHTML = html;
      if (revealed && !outcome && !notes.dataset.fallen) {
        notes.dataset.fallen = '1';
        notes.classList.add('fall'); // les touches « tombent » vers la ligne (une seule fois)
        setTimeout(function () { notes.classList.remove('fall'); }, 900);
      }
      var steps = slide.querySelector('.pptg-steps');
      if (steps) {
        steps.innerHTML = 'Enchaînement : ' + combos.map(function (c, i) {
          var st = (outcome === 'success' || i < q.step) ? 'ok' : (i === q.step && !outcome ? 'now' : '');
          return '<span class="' + st + '">' + (i + 1) + '</span>';
        }).join('<i>→</i>');
      }
      slide.querySelector('.pptg-track').classList.toggle('fast', !!revealed && !outcome);
    }

    function renderHeld() {
      if (screen !== 'playing') return;
      ['ctrl', 'shift', 'alt'].forEach(function (m) {
        var c = slide.querySelector('[data-m="' + m + '"]');
        if (c) c.classList.toggle('on', !!held[m]);
      });
    }

    function showTyped(c) {
      var t = slide.querySelector('.pptg-typed');
      if (!t) return;
      var expected = q.entry.combos[q.step];
      var ok = sameCombo(c, expected);
      t.className = 'pptg-typed ' + (ok ? 'ok' : 'ko');
      t.textContent = comboId(c) + (ok ? ' ✓' : ' ✗');
    }

    function flash(kind) {
      slide.classList.remove('flash-ok', 'flash-ko');
      void slide.offsetWidth;
      slide.classList.add('flash-' + kind);
    }

    function popup(big, small) {
      var p = slide.querySelector('.pptg-pop');
      if (!p) return;
      p.innerHTML = '<b>' + esc(big) + '</b><small>' + esc(small) + '</small>';
      p.classList.remove('show');
      void p.offsetWidth;
      p.classList.add('show');
    }

    // ---------- écran de fin ----------
    function rank(s) {
      if (s >= 25000) return 'Légende du Ctrl+S';
      if (s >= 15000) return 'Virtuose du clavier';
      if (s >= 8000) return 'Ninja du ruban';
      if (s >= 3000) return 'Consultant·e prometteur·se';
      return 'Adepte de la souris';
    }

    function renderEnd() {
      var p1 = details.filter(function (d) { return d.result === 'phase1'; }).length;
      var p2 = details.filter(function (d) { return d.result === 'phase2'; }).length;
      var rows = details.map(function (d) {
        var label = d.result === 'phase1' ? '<span class="pptg-badge p1">Phase 1 · de mémoire</span>'
          : d.result === 'phase2' ? '<span class="pptg-badge p2">Phase 2 · révélé</span>'
            : '<span class="pptg-badge ko">Ratée</span>';
        return '<tr class="lv-' + d.level + '"><td>' + d.index + '</td><td>' + esc(d.action) + '</td><td class="sc">' + esc(d.shortcut) +
          '</td><td>' + label + '</td><td class="pts">' + fmt(d.points) + (d.combo > 1 ? ' <small>' + fmtCoef(d.combo) + '</small>' : '') + '</td></tr>';
      }).join('');
      var extra = (opts.endActions || []).map(function (a, i) {
        return '<button class="pptg-btn ' + (a.primary ? '' : 'ghost') + '" data-x="' + i + '">' + esc(a.label) + '</button>';
      }).join('');
      slide.className = 'pptg-slide end';
      slide.innerHTML =
        '<div class="pptg-end">' +
        '<div class="pptg-end-head"><div><div class="pptg-kicker">Fin de la présentation</div>' +
        '<div class="pptg-end-score">' + fmt(score) + ' <small>points</small></div>' +
        '<div class="pptg-end-rank">' + rank(score) + '</div></div>' +
        '<div class="pptg-end-sum"><span><b>' + p1 + '</b> de mémoire</span><span><b>' + p2 + '</b> révélés</span><span><b>' + (details.length - p1 - p2) + '</b> ratés</span></div></div>' +
        '<table class="pptg-recap"><thead><tr><th>#</th><th>Action</th><th>Raccourci</th><th>Résultat</th><th>Points</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div class="pptg-row"><button class="pptg-btn" data-a="again">↻ Rejouer</button>' + extra + '</div>' +
        '</div>';
      bind(slide, 'again', start);
      slide.querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = opts.endActions[+b.getAttribute('data-x')];
          if (a && a.onClick) a.onClick({ score: score, details: details.slice() });
        });
      });
    }

    // ---------- test des raccourcis ----------
    var testCombos = [];
    function showTest() {
      stopLoop();
      screen = 'test';
      setBlocking(true);
      var seen = {};
      testCombos = [];
      cfg.levelOrder.forEach(function (l) {
        loaded.pools[l].forEach(function (e) {
          e.combos.forEach(function (c) {

/*
 * ============================================================================
 *  FEUILLE DE TEMPS EXPRESS · mini-jeu de chronométrage (module autonome)
 * ============================================================================
 *  Interface publique (seul nom exposé : window.TimesheetGame) :
 *
 *    var game = TimesheetGame.createGame(container, {
 *      config:     TimesheetGame.config,         // optionnel
 *      onGameEnd:  function ({ score, details }) {},
 *      sfx:        function (name) {},           // optionnel : sons fournis par l'hôte
 *      onQuit:     function () {},               // optionnel : bouton « Quitter » sur l'accueil
 *      endActions: [{ label, primary, onClick }] // optionnel : boutons en plus sur l'écran de fin
 *    });
 *    game.start();    // lance directement une partie (sinon l'accueil propose « Jouer »)
 *    game.destroy();  // retire tout (DOM, écouteurs, minuteries)
 *
 *  PRÉCISION DU CHRONOMÉTRAGE
 *  - Les instants de départ et d'arrêt sont relevés avec performance.now() en PREMIÈRE ligne
 *    du gestionnaire d'événement (pointerdown / keydown), jamais dans la boucle d'affichage.
 *  - Le score est calculé uniquement à partir de ces deux horodatages.
 *  - requestAnimationFrame ne sert qu'à rafraîchir l'affichage du chronomètre.
 */
(function () {
  'use strict';
  var NS = (window.TimesheetGame = window.TimesheetGame || {});

  var DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];
  var START_GUARD_MS = 300; // un double-clic sur « Start » ne doit pas arrêter le chrono aussitôt

  // ---------- utilitaires ----------
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtHM(min) { min = Math.max(0, Math.round(min)); return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function fmtHuman(min) { return Math.floor(min / 60) + ' h ' + pad(min % 60); }
  function fmtPts(n) { return Math.round(n).toLocaleString('fr-FR'); }
  function fmtCoef(x) { return '×' + String(x).replace('.', ','); }
  function plural(n, w) { return n + ' ' + w + (n > 1 ? 's' : ''); }

  /** Texte d'écart en minutes imputées, ton humoristique. */
  function diffText(diffMin) {
    if (diffMin > 0) return plural(diffMin, 'minute') + ' imputée' + (diffMin > 1 ? 's' : '') + ' en trop';
    if (diffMin < 0) return plural(-diffMin, 'minute') + ' oubliée' + (-diffMin > 1 ? 's' : '');
    return 'Pile à la minute près';
  }

  // sons de secours
  var ac = null;
  function beep(f, d, type, vol, delay) {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      ac = ac || new C(); if (ac.state === 'suspended') ac.resume();
      var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
    } catch (e) { /* pas de son */ }
  }
  var DEFAULT_SFX = {
    pop: function () { beep(600, 0.08, 'triangle'); },
    ding: function () { beep(880, 0.2); beep(1320, 0.3, 'sine', 0.06, 0.1); },
    error: function () { beep(200, 0.25, 'square', 0.05); },
    alarm: function () { beep(520, 0.12, 'square', 0.04); beep(400, 0.18, 'square', 0.04, 0.14); },
    win: function () { [523, 659, 784, 1046].forEach(function (f, i) { beep(f, 0.3, 'triangle', 0.08, i * 0.12); }); }

  // ======================================================================
  //  Tirage des valeurs cibles
  // ======================================================================
  function candidates(lvl) {

  //  Le jeu
  // ======================================================================
  NS.createGame = function (container, opts) {
    opts = opts || {};
    var cfg = opts.config || NS.config;
    var cfgErrors = NS.checkConfig(cfg);
    var sfx = typeof opts.sfx === 'function' ? opts.sfx : function (n) { if (DEFAULT_SFX[n]) DEFAULT_SFX[n](); };
    var TOTAL = cfg.levelOrder.reduce(function (n, k) { return n + cfg.levels[k].rounds; }, 0);

    var root = el('div', 'tsg');
    root.innerHTML =
      '<header class="tsg-bar">' +
      '<div class="tsg-brand"><span class="tsg-logo">⏱</span><b>TimeTrack Pro</b><span class="tsg-crumb">Mes temps › Saisie › Semaines 47–48</span></div>' +
      '<div class="tsg-hud"><div><small>Score</small><b data-h="score">0</b></div><div><small>Manche</small><b data-h="round">–/' + TOTAL + '</b></div>' +
      '<span class="tsg-avatar">JC</span></div>' +
      '</header>' +
      '<div class="tsg-body">' +
      '<aside class="tsg-sheet"><div class="tsg-sheet-head"><b>Feuille de temps</b><span>Statut : <i data-h="status">Brouillon</i></span></div><div class="tsg-grid"></div>' +
      '<div class="tsg-totals"><span>Demandé <b data-h="tdem">00:00</b></span><span>Imputé <b data-h="timp">00:00</b></span></div></aside>' +
      '<main class="tsg-main"></main>' +
      '</div>';

    var grid = root.querySelector('.tsg-grid');
    var hud = {};

    // ---------- état ----------
    var screen = 'home';
    var rounds = [], ri = -1, r = null;
    var phase = 'idle';        // ready | running | result
    var lockUntil = 0;         // anti double-clic (performance.now())
    var raf = 0, autoTimer = 0, destroyed = false, keysOn = false;
    var score = 0, details = [];

    // ======================================================================
    //  Entrées : pointerdown sur le gros bouton, barre d'espace au clavier
    // ======================================================================
    function onMainPointerDown(e) {

    // ======================================================================

        '<ol class="tsg-rules">' +
        '<li><b>1 heure imputée = 1 seconde réelle.</b> 30 minutes = 0,5 s.</li>' +
        '<li>Clique sur <b>Start</b>, puis sur <b>Imputer</b> (ou barre d\'espace) pile au bon moment.</li>' +
        '<li>10 manches, de plus en plus dures : le chronomètre finit par <b>disparaître</b>.</li>' +
        '</ol>' +
        (cfgErrors.length ? '<div class="tsg-alert">⚠ ' + cfgErrors.map(esc).join('<br>') + '</div>' : '') +
        '<div class="tsg-row"><button class="tsg-btn big" data-a="play"' + (cfgErrors.length ? ' disabled' : '') + '>Jouer</button>' +
        (opts.onQuit ? '<button class="tsg-btn ghost" data-a="quit">Quitter</button>' : '') + '</div>' +

      bind('quit', function () { if (opts.onQuit) opts.onQuit(); });

    function bind(action, fn) {

    // ======================================================================

          if (!projects.length) projects = shuffle(cfg.projects);
          var p = projects.pop();
          list.push({
            level: k, lvl: lvl, targetMin: m, targetMs: m / 60 * cfg.msPerHour,
            project: typeof p === 'string' ? { name: p } : p

    }

    }

    function nextRound() {

    }

    function startTimer(t) {
      r.t0 = t;

      sfx('pop');

      ui.btn.classList.add('running');
      ui.card.classList.add('running');

        base = Math.round(cfg.scoring.maxPoints * Math.max(0, 1 - errMs / cfg.scoring.zeroAtMs));
        pts = Math.round((base + (tier.bonus || 0)) * r.lvl.coef);
      }
      score += pts;
      var d = {
        index: ri + 1, day: dayLabel(ri), project: r.project.name, level: r.level,
        targetMin: r.targetMin, target: fmtHM(r.targetMin),
        imputedMs: Math.round(elapsed), imputed: timeout ? '—' : fmtHM(imputedMin),
        errorMs: timeout ? null : Math.round(errMs), diffMin: timeout ? null : diffMin,
        diffText: timeout ? cfg.timeoutLabel : diffText(diffMin),
        tier: tier.label, tone: tier.tone, stamp: tier.stamp, points: pts, timeout: !!timeout
      };
      details.push(d);
      renderResult(d, elapsed);
      renderGrid();
      renderHud(true);
      sfx(timeout ? 'alarm' : tier.tone === 'bad' || tier.tone === 'meh' ? 'error' : 'ding');
    }

    function endGame() {
      stopLoop();
      setKeys(false);
      screen = 'end';
      phase = 'idle';
      root.classList.add('ended');
      renderGrid(); renderHud();
      renderEnd();
      sfx('win');
      if (typeof opts.onGameEnd === 'function') {
        try { opts.onGameEnd({ score: score, details: details.slice() }); } catch (e) { if (window.console) console.error(e); }
      }
    }

    // ======================================================================
    //  Rendu
    // ======================================================================
    function dayLabel(i) { return DAYS[i % 5] + ' S' + (47 + Math.floor(i / 5)); }

    function renderHud(bump) {
      hud.score.textContent = fmtPts(score);
      hud.round.textContent = (screen === 'round' ? ri + 1 : screen === 'end' ? TOTAL : '–') + '/' + TOTAL;
      hud.status.textContent = screen === 'end' ? 'Soumise' : screen === 'round' ? 'En cours de saisie' : 'Brouillon';
      var dem = details.reduce(function (n, d) { return n + d.targetMin; }, 0);
      var imp = details.reduce(function (n, d) { return n + (d.timeout ? 0 : Math.round(d.imputedMs * 60 / cfg.msPerHour)); }, 0);
      hud.tdem.textContent = fmtHM(dem);
      hud.timp.textContent = fmtHM(imp);
      if (bump) { hud.score.classList.remove('bump'); void hud.score.offsetWidth; hud.score.classList.add('bump'); }
    }

    function renderGrid() {
      var html = '<div class="tsg-gh"></div>' + DAYS.map(function (d) { return '<div class="tsg-gh">' + d + '</div>'; }).join('');
      for (var w = 0; w < 2; w++) {
        html += '<div class="tsg-gw">S' + (47 + w) + '</div>';
        for (var dd = 0; dd < 5; dd++) {
          var i = w * 5 + dd, d = details[i], rr = rounds[i];
          var cls = 'tsg-cell';
          var inner = '';
          if (d) {
            cls += ' tone-' + d.tone;
            inner = '<b>' + (d.timeout ? '—' : d.imputed) + '</b><small>/' + d.target + '</small><em>' + esc(d.stamp) + '</em>';
          } else if (screen === 'round' && i === ri) {
            cls += ' current';
            inner = '<b>' + fmtHM(rr.targetMin) + '</b><small>à saisir</small>';
          } else {
            inner = '<small>' + (rr ? '' : '') + '</small>';
          }
          if (rr) inner += '<i class="tsg-cproj">' + esc(rr.project.code || rr.project.name) + '</i>';
          html += '<div class="' + cls + '">' + inner + '</div>';
        }
      }
      grid.innerHTML = html;
    }

    function renderRound() {
      var lvl = r.lvl;
      main.innerHTML =
        '<div class="tsg-card tsg-round lv-' + r.level + '">' +
        '<div class="tsg-meta"><span class="tsg-level">' + esc(lvl.label) + ' · ' + fmtCoef(lvl.coef) + '</span>' +
        '<span class="tsg-mode">' + (lvl.display === 'visible' ? '👁' : '🙈') + ' ' + esc(lvl.hint || '') + '</span>' +
        '<span class="tsg-day">' + dayLabel(ri) + ' · Manche ' + (ri + 1) + '/' + TOTAL + '</span></div>' +
        '<div class="tsg-order">Tu dois imputer <b>' + fmtHuman(r.targetMin) + '</b><br>sur <span class="tsg-proj">« ' + esc(r.project.name) + ' »</span>' +
        (r.project.code ? ' <code>' + esc(r.project.code) + '</code>' : '') + '</div>' +
        '<div class="tsg-clockwrap"><div class="tsg-clock' + (lvl.display === 'hidden' ? ' masked' : '') + '">' + (lvl.display === 'hidden' ? '??:??' : '00:00') + '</div>' +
        '<div class="tsg-target">Cible <b>' + fmtHM(r.targetMin) + '</b> = ' + String(Math.round(r.targetMs) / 1000).replace('.', ',') + ' s réelles</div>' +
        '<div class="tsg-stamp"></div></div>' +
        '<div class="tsg-result"></div>' +
        '<button class="tsg-go" type="button">Start</button>' +
        '<div class="tsg-tip">Clic, toucher ou barre d\'espace</div>' +
        '</div>';
      ui.card = main.querySelector('.tsg-round');
      ui.clock = main.querySelector('.tsg-clock');
      ui.btn = main.querySelector('.tsg-go');
      ui.tip = main.querySelector('.tsg-tip');
      ui.result = main.querySelector('.tsg-result');
      ui.stamp = main.querySelector('.tsg-stamp');
      ui.btn.addEventListener('pointerdown', onMainPointerDown);
      ui.btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }

    function renderResult(d, elapsed) {
      ui.card.classList.remove('running');
      ui.card.classList.add('done', 'tone-' + d.tone);
      ui.clock.classList.remove('masked');
      ui.clock.textContent = d.timeout ? '--:--' : d.imputed;
      ui.stamp.textContent = d.stamp;
      ui.stamp.className = 'tsg-stamp show tone-' + d.tone;
      ui.result.innerHTML =
        '<div class="tsg-res-tier">' + esc(d.tier) + '</div>' +
        '<div class="tsg-res-grid">' +
        '<span>Temps imputé</span><b>' + (d.timeout ? '—' : d.imputed) + '</b>' +
        '<span>Écart</span><b>' + esc(d.diffText) + (d.timeout ? '' : ' <small>(' + d.errorMs + ' ms réels)</small>') + '</b>' +
        '<span>Points</span><b class="pts">+' + fmtPts(d.points) + (d.points && r.lvl.coef !== 1 ? ' <small>(' + fmtCoef(r.lvl.coef) + ')</small>' : '') + '</b>' +
        '</div>';
      ui.btn.textContent = ri + 1 >= TOTAL ? 'Voir ma feuille de temps' : 'Manche suivante →';
      ui.btn.classList.remove('running');
      ui.btn.classList.add('next', 'locked');
      ui.tip.textContent = 'Clic, toucher ou barre d\'espace';
      setTimeout(function () { if (ui.btn) ui.btn.classList.remove('locked'); }, cfg.inputLockMs);
    }

    function rank(s) {
      if (s >= 14000) return 'Contrôleur·se de gestion émérite';
      if (s >= 9000) return 'Imputation chirurgicale';
      if (s >= 5000) return 'Feuille de temps acceptable';
      if (s >= 2000) return 'Relances du PMO en approche';
      return 'Inter-contrat prolongé';
    }

    function renderEnd() {
      var rows = details.map(function (d) {
        return '<tr class="tone-' + d.tone + '"><td>' + d.day + '</td><td class="proj">' + esc(d.project) + '</td><td>' + d.target + '</td><td>' + d.imputed + '</td>' +
          '<td class="gap">' + esc(d.timeout ? 'Non soumise' : d.diffText) + (d.timeout ? '' : '<small>' + d.errorMs + ' ms</small>') + '</td>' +
          '<td class="pts">' + fmtPts(d.points) + '</td><td><span class="tsg-mini-stamp tone-' + d.tone + '">' + esc(d.stamp) + '</span></td></tr>';
      }).join('');
      var extra = (opts.endActions || []).map(function (a, i) {
        return '<button class="tsg-btn ' + (a.primary ? '' : 'ghost') + '" data-x="' + i + '">' + esc(a.label) + '</button>';
      }).join('');
      main.innerHTML =
        '<div class="tsg-card tsg-end">' +
        '<div class="tsg-end-head"><div><div class="tsg-kicker">Feuille de temps soumise</div>' +
        '<div class="tsg-end-score">' + fmtPts(score) + ' <small>points</small></div>' +
        '<div class="tsg-end-rank">' + rank(score) + '</div></div>' +
        '<div class="tsg-end-stamp">SOUMIS</div></div>' +
        '<div class="tsg-tablewrap"><table class="tsg-recap"><thead><tr><th>Jour</th><th>Projet</th><th>Demandé</th><th>Imputé</th><th>Écart</th><th>Points</th><th>Statut</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
        '<div class="tsg-row"><button class="tsg-btn" data-a="again">↻ Rejouer</button>' + extra + '</div>' +
        '</div>';
      bind('again', start);
      main.querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = opts.endActions[+b.getAttribute('data-x')];
          if (a && a.onClick) a.onClick({ score: score, details: details.slice() });
        });
      });
    }

    function destroy() {
      destroyed = true;
      stopLoop();
      setKeys(false);
      if (root.parentNode) root.parentNode.removeChild(root);
    }

    showHome();
    return { start: start, destroy: destroy, showHome: showHome };
  };
})();

</script>
  <script>
/*
 * Mini-jeu 4 · Étage 11 · Contrôle de gestion — « Feuille de temps Express »
 * Adaptateur : le jeu est le module autonome js/floors/timesheet/timesheet-game.js
 * (aussi livré en fichier HTML unique : feuille-de-temps.html).
 */
(function () {
  'use strict';
  var TG = window.TowerGame;
  var TARGET = 7000;

  function toResult(r) {
    var d = r.details || [];
    var perfect = d.filter(function (x) { return x.tone === 'perfect'; }).length;
    var refused = d.filter(function (x) { return x.tone === 'bad' || x.tone === 'timeout'; }).length;
    var valid = d.filter(function (x) { return !x.timeout; });
    var avg = valid.length ? Math.round(valid.reduce(function (n, x) { return n + x.errorMs; }, 0) / valid.length) : null;
    var best = valid.reduce(function (m, x) { return Math.min(m, x.errorMs); }, Infinity);
    return {
      score: r.score,
      target: TARGET,
      success: r.score >= TARGET,
      stats: [
        ['Imputations parfaites (≤ 20 ms)', perfect],
        ['Écart moyen', avg === null ? '—' : avg + ' ms'],
        ['Meilleur écart', best === Infinity ? '—' : best + ' ms'],
        ['Feuilles refusées ou non soumises', refused],
        ['Manches', d.length]
      ],
      metrics: { perfect: perfect, refused: refused, avg: avg, best: best, timeouts: d.filter(function (x) { return x.timeout; }).length }
    };
  }

  TG.registerFloor({
    id: 'timesheet',
    order: 15,
    floorNumber: 11,
    floorLabel: 'Étage 11',
    name: 'Contrôle de gestion',
    title: 'Feuille de temps Express',
    icon: '⏱️',
    tagline: 'Impute pile le bon nombre d\'heures. 1 heure = 1 seconde. Le contrôle de gestion compte les millisecondes.',
    target: TARGET,
    start: function (root, ctx) {
      if (!window.TimesheetGame || !window.TimesheetGame.createGame) throw new Error('module TimesheetGame introuvable (js/floors/timesheet/timesheet-game.js)');
      var game = window.TimesheetGame.createGame(root, {
        sfx: ctx.sfx,
        onQuit: ctx.quit,
        endActions: [
          { label: 'Voir ma Performance Review →', primary: true, onClick: function (r) { ctx.finish(toResult(r)); } },
          { label: 'Retour à la tour', onClick: function () { ctx.quit(); } }
        ]
      });
      return { destroy: function () { game.destroy(); } };
    },
    reviewQuotes: {
      below: ['Feuille de temps rejetée 7 fois. Le contrôle de gestion connaît désormais votre prénom.',
        'A imputé 14 h sur « Inter-contrat » un mardi. Courageux.'],
      partial: ['Imputations « créatives ». Le PMO a ouvert un fichier Excel à votre nom.'],
      meets: ['Solid performance. Could demonstrate more ownership of the timesheet.'],
      exceeds: ['Imputations d\'une précision suisse. Le DAF a versé une larme.'],
      outstanding: ['Pointe à la milliseconde près. Le contrôle de gestion veut vous recruter. Refusez.']
    },
    reviewComments: function (r) {
      var m = r.metrics || {}, out = [];
      if (m.perfect >= 3) out.push(m.perfect + ' imputations parfaites : « validé sans relecture », une première dans l\'histoire du cabinet.');
      if (m.timeouts >= 2) out.push(m.timeouts + ' feuilles de temps non soumises. Trois relances automatiques ont été programmées.');
      if (m.avg !== null && m.avg <= 120) out.push('Écart moyen de ' + m.avg + ' ms : horloge interne certifiée ISO 9001.');
      if (m.avg !== null && m.avg > 400) out.push('Écart moyen de ' + m.avg + ' ms. Suggestion : un métronome sur le bureau.');
      if (!out.length) out.push('Imputations globalement cohérentes. Rien à signaler au PMO (pour une fois).');
      return out;
    }
  });
})();

  <script>
/*
 * Application : écran titre, vue de la tour (choix de l'étage), lancement d'un mini-jeu,
 * et Performance Review. Ne contient aucune règle propre à un mini-jeu.
 *
 * Contrat d'un mini-jeu (voir js/floors/_TEMPLATE.js) :
 *   start(root, ctx) -> { destroy() }
 *   root : un <div> de 1280 x 720 px (mis à l'échelle automatiquement)
 *   ctx.finish({ score, target, success, fired?, stats: [[libellé, valeur], ...] })
 *   ctx.quit()      : abandonner et revenir à la tour
 *   ctx.player      : { grade, xp }
 *   ctx.sfx(name)   : sons partagés
 */
(function () {
  'use strict';
  var TG = window.TowerGame;
  var U = TG.util;
  var W = TG.STAGE_W, H = TG.STAGE_H;

  var stage, current = null, selectedId = null;

  // ---------- mise à l'échelle ----------
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((vw - W * s) / 2) + 'px';
    stage.style.top = Math.round((vh - H * s) / 2) + 'px';
  }

  function clear() {
    if (current) {
      try { if (current.destroy) current.destroy(); } catch (e) { console.error(e); }
      current = null;
    }
    stage.innerHTML = '';
  }

  function screen(cls, html) {
    clear();
    var s = U.el('div', 'scr ' + cls, html);
    stage.appendChild(s);
    return s;
  }

  // ---------- décor partagé ----------
  function seeded(seed) {
    return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  }

  function skylineHTML(seed, layer) {
    var r = seeded(seed), out = '', x = -20;
    var colors = layer === 'back' ? ['#8fb3d9', '#9cbde0', '#a8c6e6'] : ['#5f7fa8', '#6b8bb3', '#4f6f99', '#7895bd'];
    while (x < W) {
      var w = 50 + Math.floor(r() * 80);
      var h = (layer === 'back' ? 120 : 70) + Math.floor(r() * (layer === 'back' ? 200 : 160));
      out += '<div class="bld" style="left:' + x + 'px;width:' + w + 'px;height:' + h + 'px;--b:' + colors[Math.floor(r() * colors.length)] + '"></div>';
      x += w + 6 + Math.floor(r() * 20);
    }
    if (layer === 'back') out += '<div class="arche" style="left:860px;width:150px;height:150px"></div>';
    return '<div class="skyline ' + layer + '">' + out + '</div>';
  }

  function skyHTML() {
    return '<div class="sky"></div>' +
      '<div class="cloud" style="top:60px;width:140px;height:40px;animation-duration:70s;animation-delay:-20s"></div>' +
      '<div class="cloud" style="top:140px;width:100px;height:30px;animation-duration:90s;animation-delay:-60s"></div>' +
      '<div class="cloud" style="top:30px;width:180px;height:46px;animation-duration:110s;animation-delay:-5s"></div>' +
      skylineHTML(7, 'back') + skylineHTML(42, 'front');
  }

  function towerArtHTML(cls) {
    return '<div class="tower-art ' + (cls || '') + '"><div class="ta-antenna"></div><div class="ta-crown"></div><div class="ta-body"></div><div class="ta-base"><span>TOUR FRANKLIN</span></div></div>';
  }

  // ---------- écran titre ----------
  function showTitle() {
    var has = TG.state.hasProgress();
    var s = screen('title-scr',
      skyHTML() +
      towerArtHTML('title-tower') +
      '<div class="title-hero">' + TG.characterSVG({ player: true, mood: 'happy', briefcase: true }) + '</div>' +
      '<div class="title-box">' +
      '<div class="title-kicker">Premier jour à La Défense</div>' +
      '<h1 class="title-logo">UP <span>or</span> OUT</h1>' +
      '<p class="title-sub">Survis à ta première journée de consultant dans la <b>Tour Franklin</b>. Un étage, une mission. Ta carrière commence au lobby.</p>' +
      '<div class="ladder">' + TG.GRADES.map(function (g) { return '<span>' + g.name + '</span>'; }).join('<i>→</i>') + '</div>' +
      '<div class="title-actions">' +
      '<button class="btn" data-a="go">' + (has ? 'Continuer ma carrière' : 'Commencer ma journée') + '</button>' +
      (has ? '<button class="btn ghost" data-a="reset">Nouvelle carrière</button>' : '') +
      '</div></div>');
    s.querySelector('[data-a="go"]').onclick = function () { TG.sfx('click'); showTower(); };
    var rb = s.querySelector('[data-a="reset"]');
    if (rb) rb.onclick = function () {
      if (rb.dataset.confirm) { TG.state.reset(); TG.sfx('click'); showTitle(); return; }
      rb.dataset.confirm = '1';
      rb.textContent = 'Sûr ? Cliquer pour effacer';
    };
  }

  // ---------- la tour ----------
  function floorStatus(f) {
    if (!TG.state.isUnlocked(f.id)) return 'locked';
    return f.comingSoon ? 'soon' : 'open';
  }

  function showTower(focusId) {
    var floors = TG.getFloors();
    var g = TG.state.grade(), next = TG.state.nextGrade(), gi = TG.state.gradeIndex();
    var xp = TG.state.xp;
    if (focusId) selectedId = focusId;
    if (!selectedId || !TG.getFloor(selectedId)) {
      // par défaut : le plus haut étage jouable
      var open = floors.filter(function (f) { return floorStatus(f) === 'open'; });
      selectedId = (open[open.length - 1] || floors[0]).id;
    }

    var BODY_H = 600;
    var bands = floors.map(function (f, i) {
      var st = floorStatus(f);
      // étages répartis régulièrement sur la hauteur de la tour, dans l'ordre
      var bottom = 6 + (floors.length > 1 ? i * (BODY_H - 56) / (floors.length - 1) : 0);
      var badge = st === 'locked' ? '🔒' : st === 'soon' ? 'SOON' : '▶';
      return '<button class="tw-floor st-' + st + '" data-id="' + f.id + '" style="bottom:' + bottom + 'px">' +
        '<span class="tw-tag"><b>' + f.floorLabel + '</b> ' + f.name + '</span>' +
        '<span class="tw-band"><span class="tw-ico">' + f.icon + '</span><span class="tw-badge">' + badge + '</span></span>' +
        '</button>';
    }).join('');

    var s = screen('tower-scr',
      skyHTML() +
      '<div class="tw-tower"><div class="ta-antenna"></div><div class="ta-crown"></div>' +
      '<div class="tw-body" style="height:' + BODY_H + 'px">' + bands + '</div>' +
      '<div class="ta-base"><span>TOUR FRANKLIN</span></div></div>' +
      '<aside class="tw-panel">' +
      '<div class="tw-profile">' +
      '<div class="tw-avatar">' + TG.characterSVG({ player: true, mood: 'happy' }) + '</div>' +
      '<div class="tw-id"><div class="tw-who">Toi · badge n°1042 · premier jour</div>' +
      '<div class="tw-grade">' + g.name + '</div>' +
      '<div class="xpbar"><i style="width:' + Math.round(TG.state.gradeProgress(xp) * 100) + '%"></i></div>' +
      '<div class="tw-xp">' + U.fmtNum(xp) + ' XP' + (next ? ' · prochain grade : <b>' + next.name + '</b> à ' + U.fmtNum(next.xp) + ' XP' : ' · sommet atteint 🏆') + '</div>' +
      '</div></div>' +
      '<div class="career">' + TG.GRADES.map(function (gr, i) {
        return '<div class="cr-step ' + (i < gi ? 'done' : i === gi ? 'now' : '') + '"><span></span>' + gr.name + '</div>';
      }).join('') + '</div>' +
      '<div class="tw-detail"></div>' +
      '</aside>' +
      '<button class="btn ghost small tw-home">← Accueil</button>');

    s.querySelector('.tw-home').onclick = function () { TG.sfx('click'); showTitle(); };
    s.querySelectorAll('.tw-floor').forEach(function (b) {
      b.onclick = function () { TG.sfx('click'); selectedId = b.dataset.id; renderDetail(s); };
      b.ondblclick = function () { var f = TG.getFloor(b.dataset.id); if (floorStatus(f) === 'open') playFloor(f.id); };
    });
    renderDetail(s);
  }

  function renderDetail(s) {
    var f = TG.getFloor(selectedId);
    var st = floorStatus(f);
    var stats = TG.state.floorStats(f.id);
    s.querySelectorAll('.tw-floor').forEach(function (b) { b.classList.toggle('sel', b.dataset.id === f.id); });
    var action;
    if (st === 'open') action = '<button class="btn big" data-a="play">Lancer la mission ▶</button>';
    else if (st === 'soon') action = '<div class="soon-box">COMING SOON</div><p class="muted">Étage débloqué ! Le mini-jeu arrive dans une prochaine version.</p>';
    else action = '<div class="locked-box">🔒 Étage verrouillé</div><p class="muted">Réussis la mission de l\'étage précédent pour y accéder.</p>';
    var d = s.querySelector('.tw-detail');
    d.innerHTML =
      '<div class="td-label">' + f.floorLabel + ' · ' + f.name + '</div>' +
      '<div class="td-title">' + f.icon + ' ' + (f.title || f.name) + '</div>' +
      '<p class="td-tag">' + f.tagline + '</p>' +
      (st === 'open' ? '<div class="td-stats"><span>Objectif <b>' + U.fmtNum(f.target) + '</b> pts</span><span>Record <b>' + U.fmtNum(stats.best) + '</b></span><span>Missions réussies <b>' + stats.wins + '/' + stats.plays + '</b></span></div>' : '') +
      action;
    var pb = d.querySelector('[data-a="play"]');
    if (pb) pb.onclick = function () { TG.sfx('click'); playFloor(f.id); };
  }

  // ---------- lancement d'un mini-jeu ----------
  function playFloor(id) {
    var f = TG.getFloor(id);
    if (!f || f.comingSoon || !TG.state.isUnlocked(id)) return;
    var root = screen('floor-scr floor-' + f.id, '');
    var finished = false;
    var ctx = {
      floor: f,
      player: { grade: TG.state.grade(), xp: TG.state.xp },
      sfx: TG.sfx,
      finish: function (result) {
        if (finished) return;
        finished = true;
        showReview(f, result);
      },
      quit: function () {
        if (finished) return;
        finished = true;
        showTower(f.id);
      }
    };
    try {
      current = f.start(root, ctx) || null;
    } catch (e) {
      console.error(e);
      root.innerHTML = '<div class="crash">Ce mini-jeu a planté 😬<br><small>' + String(e && e.message) + '</small></div>';
    }
  }

  // ---------- Performance Review ----------
  function showReview(f, result) {
    var rv = TG.review.compute(f, result);
    var change = TG.state.recordResult(f.id, result, rv.xpGain);
    var fromP = TG.state.gradeProgress(change.beforeXp);
    var toP = TG.state.gradeProgress(change.afterXp);
    var next = TG.state.nextGrade();

    var statsHTML = (result.stats || []).map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');
    var comments = rv.comments.map(function (c) { return '<li>' + c + '</li>'; }).join('');

    var unlockHTML = '';
    if (change.unlockedFloor) {
      var uf = change.unlockedFloor;
      unlockHTML = '<div class="rv-unlock">🔓 <b>' + uf.floorLabel + ' débloqué</b> · ' + uf.name + ' — ' + (uf.comingSoon ? '<span class="soon-tag">COMING SOON</span>' : uf.title) + '</div>';
    }

    var s = screen('review-scr',
      skyHTML() +
      '<div class="rv-paper">' +
      '<div class="rv-head"><div class="rv-title">PERFORMANCE REVIEW</div>' +
      '<div class="rv-meta">FY26 · Mission « ' + (f.title || f.name) + ' » · ' + f.floorLabel + ' · <i>Strictement confidentiel</i></div></div>' +
      '<div class="rv-cols"><div class="rv-left">' +
      '<div class="rv-stamp" style="--c:' + rv.tier.color + '">' + rv.tier.label + '</div>' +
      '<blockquote class="rv-quote">“' + rv.quote + '”</blockquote>' +
      '<div class="rv-sign">— Ton Manager, qui t\'a croisé 4 minutes cette année</div>' +
      (comments ? '<div class="rv-ctitle">Commentaires du comité</div><ul class="rv-comments">' + comments + '</ul>' : '') +
      '</div><div class="rv-right">' +
      '<div class="rv-score ' + (result.success ? 'ok' : 'ko') + '"><span>Score</span><b>' + U.fmtNum(result.score) + '</b><small>objectif ' + U.fmtNum(result.target) + (change.newBest && result.score > 0 ? ' · 🏅 record !' : '') + '</small></div>' +
      '<table class="rv-stats">' + statsHTML + '</table>' +
      '<div class="rv-xp"><div class="rv-xp-top"><span>' + (rv.xpGain > 0 ? '+' + U.fmtNum(rv.xpGain) + ' XP' : 'Pas d\'XP : mission non validée') + '</span><span>' + change.grade.name + '</span></div>' +
      '<div class="xpbar"><i style="width:' + Math.round((change.promoted ? 0 : fromP) * 100) + '%"></i></div>' +
      '<div class="rv-xp-sub">' + U.fmtNum(change.afterXp) + ' XP' + (next ? ' · ' + next.name + ' à ' + U.fmtNum(next.xp) + ' XP' : ' · Partner. Il n\'y a plus rien au-dessus, à part le rooftop.') + '</div></div>' +
      unlockHTML +
      '</div></div>' +
      '<div class="rv-actions"><button class="btn blue" data-a="again">↻ Rejouer</button><button class="btn" data-a="tower">Retour à la tour</button></div>' +
      '</div>' +
      (change.promoted ? '<div class="promo"><div class="promo-card"><div class="promo-k">🎉 PROMOTION 🎉</div><div class="promo-g">' + change.grade.name + '</div><div class="promo-s">Nouveau titre, même salaire (pour l\'instant).</div><button class="btn" data-a="promo-ok">Merci, je le mérite</button></div>' + confetti() + '</div>' : ''));

    setTimeout(function () {
      var bar = s.querySelector('.rv-xp .xpbar i');
      if (bar) bar.style.width = Math.round(toP * 100) + '%';
    }, 400);
    TG.sfx(result.success ? 'win' : 'lose');
    if (change.promoted) setTimeout(function () { TG.sfx('promo'); }, 700);

    s.querySelector('[data-a="again"]').onclick = function () { TG.sfx('click'); playFloor(f.id); };
    s.querySelector('[data-a="tower"]').onclick = function () {
      TG.sfx('click');
      showTower(change.unlockedFloor ? change.unlockedFloor.id : f.id);
    };
    var po = s.querySelector('[data-a="promo-ok"]');
    if (po) po.onclick = function () { s.querySelector('.promo').remove(); };
  }

  function confetti() {
    var out = '', colors = ['#ffb703', '#fb8500', '#e63946', '#2a9d8f', '#4f8cff', '#9b5de5'];
    for (var i = 0; i < 70; i++) {
      out += '<i style="left:' + Math.random() * 100 + '%;background:' + colors[i % colors.length] +
        ';animation-delay:' + (Math.random() * 1.5).toFixed(2) + 's;animation-duration:' + (2 + Math.random() * 2).toFixed(2) + 's"></i>';
    }
    return '<div class="confetti">' + out + '</div>';
  }

  // ---------- démarrage ----------
  function boot() {
    stage = document.getElementById('stage');
    fit();
    window.addEventListener('resize', fit);
    var mute = document.getElementById('mute');
    var syncMute = function () { mute.textContent = TG.state.muted ? '🔇' : '🔊'; };
    mute.onclick = function () { TG.state.setMuted(!TG.state.muted); syncMute(); TG.sfx('click'); };
    syncMute();
    showTitle();
  }

  TG.app = {
    showTitle: showTitle, showTower: showTower, playFloor: playFloor,
    currentGame: function () { return current; } // utile pour déboguer depuis la console
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
