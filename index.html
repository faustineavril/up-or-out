  <style>
/* ===== Base ===== */
:root {
  --navy: #14213d;
  --navy2: #22345f;
  --gold: #ffb703;
  --gold2: #fb8500;
  --ink: #1b1b2f;
  --paper: #fffdf6;
  --good: #22c55e;
  --bad: #ef4444;
  --warn: #f59e0b;
  --font: 'Fredoka', 'Baloo 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0b1026; color: var(--ink); font-family: var(--font);
  user-select: none; -webkit-user-select: none;
}
#viewport { position: fixed; inset: 0; background: radial-gradient(circle at 50% 30%, #22336b, #0b1026 70%); }
#stage {
  position: absolute; width: 1280px; height: 720px; transform-origin: 0 0;
  overflow: hidden; overflow: clip; border-radius: 14px; background: #9fd3ff;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}
#mute {
  position: fixed; right: 12px; bottom: 12px; z-index: 1000; width: 42px; height: 42px;
  border-radius: 50%; border: 0; font-size: 20px; background: rgba(255, 255, 255, .85); cursor: pointer;
}
.scr { position: absolute; inset: 0; overflow: clip; }
button { font-family: inherit; cursor: pointer; }
.muted { color: #6b7280; font-size: 15px; }

.btn {
  border: 0; border-radius: 14px; padding: 12px 24px; font-size: 21px; font-weight: 700; color: #fff;
  background: linear-gradient(#ffc233, #fb8500); letter-spacing: .3px;
  box-shadow: 0 6px 0 #b45309, 0 10px 18px rgba(0, 0, 0, .25);
  transition: transform .08s, box-shadow .08s, filter .15s; text-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309, 0 4px 8px rgba(0, 0, 0, .25); }
.btn.big { font-size: 26px; padding: 16px 34px; }
.btn.small { font-size: 16px; padding: 8px 16px; }
.btn.blue { background: linear-gradient(#5b9bff, #2b5fd9); box-shadow: 0 6px 0 #1b3f99, 0 10px 18px rgba(0, 0, 0, .25); }
.btn.ghost { background: rgba(255, 255, 255, .18); border: 2px solid rgba(255, 255, 255, .7); box-shadow: 0 4px 0 rgba(0, 0, 0, .2); }
.btn.ghost.dark { background: #eef2f7; color: var(--navy); border-color: #cbd5e1; text-shadow: none; }

/* ===== Personnages ===== */
.char { display: block; width: 100%; height: auto; overflow: visible; }
.char .f-happy, .char .f-neutral, .char .f-angry { display: none; }
.char.mood-happy .f-happy, .char.mood-neutral .f-neutral, .char.mood-angry .f-angry { display: inline; }

/* ===== Ciel & skyline de La Défense ===== */
.sky { position: absolute; inset: 0; background: linear-gradient(#4aa3ff 0%, #9fd6ff 55%, #ffe3bd 100%); }
.cloud { position: absolute; left: 0; background: #fff; border-radius: 60px; opacity: .85; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 50%; height: 150%; left: 14%; bottom: 25%; }
.cloud::after { width: 38%; height: 120%; right: 12%; bottom: 15%; }
@keyframes drift { from { transform: translateX(-250px); } to { transform: translateX(1500px); } }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; pointer-events: none; }
.bld {
  position: absolute; bottom: 0; background-color: var(--b); border-radius: 3px 3px 0 0;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 9px, rgba(255, 255, 255, .22) 9px 13px),
    repeating-linear-gradient(0deg, transparent 0 10px, rgba(0, 0, 0, .1) 10px 13px);
}
.skyline.back .bld { opacity: .85; }
.arche { position: absolute; bottom: 0; border: 20px solid #eef3f9; box-shadow: inset 0 0 0 3px #d4dde9; }

/* ===== Tour (dessin partagé) ===== */
.tower-art, .tw-tower { position: absolute; }
.ta-antenna { position: absolute; left: 50%; top: 0; width: 6px; height: 40px; margin-left: -3px; background: #6b7280; }
.ta-antenna::after { content: ''; position: absolute; top: -6px; left: -3px; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; animation: blinkred 1.4s infinite; }
@keyframes blinkred { 50% { opacity: .2; } }
.ta-crown { position: absolute; left: 8%; right: 8%; top: 38px; height: 22px; background: #263552; border-radius: 6px 6px 0 0; }
.ta-body {
  position: absolute; left: 0; right: 0; top: 58px; bottom: 40px; border-radius: 4px 4px 0 0;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, .22), transparent 30%, transparent 65%, rgba(0, 0, 0, .3)),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .25) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(0deg, #1b2847 0 4px, #4a6a9c 4px 18px);
  box-shadow: inset 0 0 0 4px #121c36;
}
.ta-base {
  position: absolute; left: -12px; right: -12px; bottom: 0; height: 42px; border-radius: 4px 4px 0 0;
  background: linear-gradient(#d9e4f2, #aebfd6); box-shadow: inset 0 3px 0 #fff, 0 -2px 0 #121c36;
  display: flex; align-items: center; justify-content: center;
}
.ta-base span { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--navy); }

/* ===== Écran titre ===== */
.title-tower { left: 860px; bottom: 0; width: 230px; height: 690px; }
.title-hero { position: absolute; left: 1090px; bottom: 8px; width: 130px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.title-box {
  position: absolute; left: 70px; top: 90px; width: 690px; padding: 34px 40px 36px;
  background: rgba(20, 33, 61, .9); color: #fff; border-radius: 26px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35); border: 3px solid rgba(255, 255, 255, .15);
}
.title-kicker { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 700; padding: 4px 14px; border-radius: 30px; font-size: 16px; letter-spacing: .5px; }
.title-logo { margin: 14px 0 6px; font-size: 104px; line-height: 1; letter-spacing: 2px; color: #fff; text-shadow: 0 6px 0 #0b1328, 0 0 30px rgba(255, 183, 3, .35); }
.title-logo span { font-size: 46px; color: var(--gold); vertical-align: middle; margin: 0 6px; font-style: italic; }
.title-sub { font-size: 21px; line-height: 1.4; color: #dbe4f5; margin: 10px 0 18px; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; margin-bottom: 26px; }
.ladder span { background: rgba(255, 255, 255, .12); border-radius: 8px; padding: 4px 10px; }
.ladder i { color: var(--gold); font-style: normal; }
.title-actions { display: flex; gap: 16px; align-items: center; }

/* ===== Vue de la tour ===== */
.tw-tower { left: 380px; bottom: 0; width: 250px; height: 700px; }
.tw-tower .ta-antenna { top: 0; }
.tw-tower .ta-crown { top: 38px; }
.tw-body {
  position: absolute; left: 0; right: 0; bottom: 42px; border-radius: 4px 4px 0 0;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, .22), transparent 30%, transparent 65%, rgba(0, 0, 0, .3)),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .25) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(0deg, #1b2847 0 4px, #4a6a9c 4px 18px);
  box-shadow: inset 0 0 0 4px #121c36;
}
.tw-floor { position: absolute; left: -8px; right: -8px; height: 46px; border: 0; padding: 0; background: none; }
.tw-band {
  position: absolute; inset: 0; border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; border: 3px solid #121c36; transition: transform .15s, box-shadow .15s;
}
.tw-ico { font-size: 24px; }
.tw-badge { font-weight: 700; font-size: 15px; border-radius: 8px; padding: 2px 8px; }
.st-open .tw-band { background: linear-gradient(#ffe08a, #ffb703); box-shadow: 0 0 20px rgba(255, 196, 0, .7); }
.st-open .tw-badge { background: var(--navy); color: #fff; }
.st-soon .tw-band { background: linear-gradient(#cfe0ff, #9db8ea); }
.st-soon .tw-badge { background: #fff; color: #2b5fd9; font-size: 12px; letter-spacing: 1px; }
.st-locked .tw-band { background: rgba(30, 40, 70, .85); filter: saturate(.3); }
.st-locked .tw-ico { opacity: .4; }
.tw-floor:hover .tw-band { transform: scale(1.05); }
.tw-floor.sel .tw-band { outline: 4px solid #fff; outline-offset: 2px; transform: scale(1.07); }
.tw-tag {
  position: absolute; right: calc(100% + 22px); top: 50%; transform: translateY(-50%); white-space: nowrap;
  background: rgba(255, 255, 255, .92); border-radius: 10px; padding: 6px 12px; font-size: 16px; color: var(--navy);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
}
.tw-tag::after { content: ''; position: absolute; left: 100%; top: 50%; width: 22px; border-top: 2px dashed rgba(255, 255, 255, .9); }
.tw-tag b { color: var(--gold2); margin-right: 4px; }
.st-locked .tw-tag { opacity: .65; }
.tw-floor.sel .tw-tag { background: var(--navy); color: #fff; }

.tw-panel {
  position: absolute; left: 710px; top: 24px; width: 545px; bottom: 24px; padding: 22px 26px;
  background: var(--paper); border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 0, 0, .3);
  display: flex; flex-direction: column; gap: 16px;
}
.tw-profile { display: flex; gap: 18px; align-items: center; }
.tw-avatar { width: 92px; height: 108px; border-radius: 18px; background: linear-gradient(#cfe6ff, #9fd3ff); overflow: hidden; flex: none; }
.tw-avatar .char { width: 130%; margin: 4px 0 0 -15%; }
.tw-id { flex: 1; }
.tw-who { font-size: 14px; color: #6b7280; }
.tw-grade { font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1.1; margin-bottom: 6px; }
.tw-xp { font-size: 14px; color: #4b5563; margin-top: 6px; }
.xpbar { height: 16px; border-radius: 10px; background: #e5e7eb; overflow: hidden; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .12); }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb703, #fb8500); border-radius: 10px; transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.career { display: flex; gap: 4px; }
.cr-step { flex: 1; font-size: 12.5px; text-align: center; color: #9ca3af; position: relative; padding-top: 18px; line-height: 1.15; }
.cr-step span { position: absolute; top: 0; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #e5e7eb; }
.cr-step.done { color: #16a34a; }
.cr-step.done span { background: #22c55e; }
.cr-step.now { color: var(--navy); font-weight: 700; }
.cr-step.now span { background: var(--gold2); box-shadow: 0 0 0 4px rgba(251, 133, 0, .25); }
.tw-detail { flex: 1; border-top: 2px dashed #e5e7eb; padding-top: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.td-label { font-size: 15px; color: var(--gold2); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.td-title { font-size: 34px; font-weight: 700; color: var(--navy); line-height: 1.1; }
.td-tag { font-size: 18px; color: #374151; margin: 0; line-height: 1.4; }
.td-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 10px; }
.td-stats span { background: #eef2f7; border-radius: 10px; padding: 6px 12px; font-size: 15px; }
.soon-box, .locked-box { font-size: 30px; font-weight: 700; letter-spacing: 3px; padding: 10px 22px; border-radius: 14px; }
.soon-box { background: repeating-linear-gradient(45deg, #2b5fd9 0 18px, #3b6fe9 18px 36px); color: #fff; transform: rotate(-2deg); }
.locked-box { background: #e5e7eb; color: #6b7280; font-size: 24px; letter-spacing: 1px; }
.tw-home { position: absolute; left: 20px; top: 20px; }

/* ===== Performance Review ===== */
.review-scr .sky { filter: brightness(.75); }
.rv-paper {
  position: absolute; left: 80px; right: 80px; top: 22px; bottom: 22px; padding: 22px 34px;
  background: var(--paper); border-radius: 10px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  background-image: repeating-linear-gradient(transparent 0 31px, rgba(43, 95, 217, .06) 31px 32px);
  display: flex; flex-direction: column;
  animation: paperIn .5s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes paperIn { from { transform: translateY(40px) rotate(-1deg); opacity: 0; } }
.rv-head { border-bottom: 3px double #1f2937; padding-bottom: 8px; margin-bottom: 14px; }
.rv-title { font-size: 34px; font-weight: 700; letter-spacing: 6px; color: var(--navy); }
.rv-meta { font-size: 15px; color: #6b7280; }
.rv-cols { display: flex; gap: 30px; flex: 1; min-height: 0; }
.rv-left { flex: 1.15; }
.rv-right { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.rv-stamp {
  display: inline-block; font-size: 30px; font-weight: 700; color: var(--c); border: 5px solid var(--c);
  border-radius: 10px; padding: 6px 18px; transform: rotate(-3deg); letter-spacing: 1px;
  animation: stamp .45s .25s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes stamp { from { transform: scale(2.4) rotate(-12deg); opacity: 0; } }
.rv-quote { font-size: 23px; line-height: 1.35; margin: 18px 0 6px; font-style: italic; color: #1f2937; }
.rv-sign { font-size: 14px; color: #6b7280; margin-bottom: 14px; }
.rv-ctitle { font-weight: 700; font-size: 15px; color: var(--navy); text-transform: uppercase; letter-spacing: 1px; }
.rv-comments { margin: 6px 0 0; padding-left: 20px; font-size: 16.5px; line-height: 1.4; color: #374151; }
.rv-comments li { margin-bottom: 4px; }
.rv-score { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-radius: 14px; }
.rv-score.ok { background: #dcfce7; }
.rv-score.ko { background: #fee2e2; }
.rv-score span { font-size: 16px; font-weight: 700; color: #374151; }
.rv-score b { font-size: 40px; color: var(--navy); }
.rv-score small { font-size: 14px; color: #4b5563; }
.rv-stats { width: 100%; border-collapse: collapse; font-size: 16px; }
.rv-stats td { padding: 4px 6px; border-bottom: 1px dotted #cbd5e1; }
.rv-stats td:last-child { text-align: right; font-weight: 700; }
.rv-xp-top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; color: var(--navy); }
.rv-xp-sub { font-size: 13.5px; color: #6b7280; margin-top: 5px; }
.rv-unlock { background: #eaf1ff; border: 2px dashed #2b5fd9; border-radius: 12px; padding: 8px 12px; font-size: 16px; color: var(--navy); }
.soon-tag { background: #2b5fd9; color: #fff; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
.rv-actions { display: flex; gap: 16px; justify-content: flex-end; margin-top: 12px; }

.promo { position: absolute; inset: 0; background: rgba(10, 16, 38, .7); display: flex; align-items: center; justify-content: center; z-index: 50; }
.promo-card { position: relative; z-index: 2; background: var(--navy); color: #fff; border-radius: 26px; padding: 34px 54px; text-align: center; border: 4px solid var(--gold); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.promo-k { font-size: 24px; color: var(--gold); font-weight: 700; letter-spacing: 3px; }
.promo-g { font-size: 64px; font-weight: 700; margin: 6px 0; }
.promo-s { font-size: 18px; color: #c7d2e8; margin-bottom: 22px; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(780px) rotate(720deg); } }

.crash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 30px; background: #fff; }

</style>

  <style>
/* ===== Mini-jeu 1 : Lobby / Ascenseurs ===== */

/* décor */
.lb-wall {
  position: absolute; left: 0; right: 0; top: 0; height: 362px; z-index: 0;

    repeating-linear-gradient(90deg, rgba(255, 255, 255, .0) 0 409px, rgba(0, 0, 0, .06) 409px 411px),

.lb-floor {

  border-top: 6px solid #8b7a62;
}
.lb-rope {
  position: absolute; left: 200px; width: 800px; top: 622px; height: 6px; border-radius: 4px;

}

/* groupes d'ascenseurs */
.lb-bank { position: absolute; top: 66px; width: 360px; height: 296px; border-radius: 14px; transition: transform .12s; }
.lb-sign {
  position: absolute; left: 30px; right: 30px; top: 0; height: 56px; border-radius: 12px;
  background: linear-gradient(#26324f, #141c30); border: 3px solid var(--c);
  display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #fff;

.lb-letter { width: 40px; height: 40px; border-radius: 10px; background: var(--c); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; }
.lb-range { font-size: 18px; letter-spacing: .5px; }
.lb-range b { font-size: 26px; margin-left: 4px; color: #fff; }
.lb-doors { position: absolute; left: 0; right: 0; top: 66px; height: 228px; }
.lb-elev { position: absolute; top: 0; width: 50px; height: 228px; }
.lb-ind {

  font-weight: 700; text-align: center; line-height: 18px; font-family: 'Courier New', monospace;
}
.lb-ind.lit { color: #3dff8a; text-shadow: 0 0 6px #3dff8a; }
.lb-shaft {
  position: absolute; top: 20px; left: 0; right: 0; bottom: 0; overflow: hidden;
  border: 4px solid #9aa3ad; border-bottom: 0; border-radius: 4px 4px 0 0;
  background: #c9a85a;
  box-shadow: inset 0 0 0 2px #707a85;

.lb-cabin { position: absolute; inset: 0; background: linear-gradient(#fff3c4, #e8c46c); }
.lb-leaf {

@keyframes flashbad { 0%, 100% { opacity: 0; } 30% { opacity: 1; } }

/* panne */

  position: absolute; left: 0; right: 0; top: 90px; height: 34px; transform: rotate(-6deg);

 * Noyau du jeu : registre des étages (= mini-jeux).
 * Chaque mini-jeu s'enregistre avec TowerGame.registerFloor({...}) depuis son propre fichier
 * (voir js/floors/_TEMPLATE.js). Le noyau ne connaît aucun mini-jeu en particulier.
 */
(function () {
  'use strict';
  var TG = (window.TowerGame = window.TowerGame || {});
  TG.STAGE_W = 1280;
  TG.STAGE_H = 720;

  var floors = [];

  TG.registerFloor = function (def) {
    if (!def || !def.id) throw new Error('registerFloor : un id est requis');
    var floor = Object.assign(
      {
        order: 99,          // position dans la tour (0 = rez-de-chaussée)
        floorNumber: 0,     // étage affiché sur la tour (0..32)
        floorLabel: '?',    // libellé court : "RDC", "Étage 8"...
        name: def.id,       // nom du lieu
        title: '',          // nom du mini-jeu

(function () {

        var d = JSON.parse(raw);
        if (d && d.version === 1) return Object.assign(fresh(), d);
      }
    } catch (e) { /* stockage indisponible : partie non sauvegardée */ }

  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignoré */ }
  }

  function gradeIndexFor(xp) {
    var idx = 0;
    GRADES.forEach(function (g, k) { if (xp >= g.xp) idx = k; });
    return idx;
  }

  var data = load();

    get xp() { return data.xp; },

    hasProgress: function () { return data.xp > 0 || Object.keys(data.floors).length > 0; },
    gradeIndexFor: gradeIndexFor,

    nextGrade: function () { return GRADES[gradeIndexFor(data.xp) + 1] || null; },

    gradeProgress: function (xp) {
      var i = gradeIndexFor(xp);
      var cur = GRADES[i], next = GRADES[i + 1];
      if (!next) return 1;
      return (xp - cur.xp) / (next.xp - cur.xp);
    },
    /** Un étage est ouvert si c'est le premier, ou si l'étage juste en dessous a été réussi au moins une fois.
     *  (Calculé à la volée : insérer un nouvel étage dans la tour ne casse pas une sauvegarde existante.) */
    isUnlocked: function (id) {

      var fs = (data.floors[floorId] = Object.assign({ plays: 0, wins: 0, best: 0 }, data.floors[floorId]));
      fs.plays++;

      if (newBest) fs.best = Math.max(0, Math.round(result.score));

(function () {
  'use strict';
  var TG = window.TowerGame;

  function audio() {
    if (!ac) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone(freq, dur, type, vol, delay, slide) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  var SOUNDS = {
    ding: function () { tone(880, 0.25, 'sine', 0.14); tone(1320, 0.4, 'sine', 0.11, 0.12); },

        'Excellent sens du client. A transformé un lobby en véritable « customer journey ».'],
      outstanding: ['Les ascenseurs l\'appellent par son prénom. Partner material (dans 12 ans).']
    },
    reviewComments: function (r) {
      var m = r.metrics || {}, out = [];
      if (m.errors === 0) out.push('Zéro erreur d\'aiguillage : le département Qualité vous cite en exemple.');
      else if (m.errors >= 10) out.push(m.errors + ' erreurs d\'aiguillage. Certains clients sont encore au parking.');
      if (m.vipServed >= 5) out.push('Gestion remarquable des comptes stratégiques (' + m.vipServed + ' VIP).');
      if (m.vipLost >= 2) out.push(m.vipLost + ' VIP sont repartis furieux. Le Partner « aimerait en discuter ».');
      if (m.bestStreak >= 10) out.push('Série de ' + m.bestStreak + ' sans faute : on parle déjà de vous à la machine à café.');
      if (m.sat < 50 && !r.fired) out.push('Les clients évoquent une « expérience ascensionnelle perfectible ».');
      if (m.served < 10) out.push('Volume d\'accueil faible. Avez-vous pensé à « scaler » ?');
      if (!out.length) out.push('RAS. Ce qui, en soi, est déjà un signal faible positif.');
      return out;
    }
  });

  // ======================================================================
  function Lobby(root, ctx) {
    this.root = root;
    this.ctx = ctx;
    this.timers = [];
    this.loop = this.loop.bind(this);
    this.onKey = this.onKey.bind(this);
    this.banks = BANKS.map(function (b) { return Object.assign({ busy: [0, 0, 0, 0, 0, 0] }, b); });
    this.build();
    this.reset();
    window.addEventListener('keydown', this.onKey);
    this.showIntro();
  }

  var P = Lobby.prototype;

  P.later = function (fn, ms) {
    var id = setTimeout(fn, ms);

  };

  // ---------- construction du décor ----------

      }

        '<div class="lb-doors">' + doors + '</div>' +
        '<div class="lb-broken"><div class="lb-tape">⚠ EN PANNE ⚠ EN PANNE ⚠</div><div class="lb-tech">🔧</div><div class="lb-timer"></div></div>';
      banksEl.appendChild(bank);
      b.el = bank;
      b.elevs = Array.prototype.slice.call(bank.querySelectorAll('.lb-elev'));
    });

    this.clientsEl = w.querySelector('.lb-clients');

    this.hud = {};
    var hud = this.hud;
    w.querySelectorAll('[data-k]').forEach(function (e) { hud[e.dataset.k] = e; });
    this.scoreBar = w.querySelector('.hud-score-bar i');

    w.querySelector('.hud-pause').onclick = function () { self.togglePause(); };

  P.reset = function () {
    this.served = 0; this.errors = 0; this.sat = 100; this.score = 0;
    this.elapsed = 0; this.time = DURATION;
    this.queue = []; this.nextId = 0; this.spawnTimer = 0.6;
    this.breakdown = null; this.nextBreakdown = 18;
    this.streak = 0; this.bestStreak = 0; this.vipServed = 0; this.vipLost = 0;
    this.running = false; this.paused = false; this.over = false;
    this.lastTick = -1;
    var self = this;
    this.events = [
      { t: 0.3, fn: function () { self.banner('👋 Glisse chaque client vers le bon groupe d\'ascenseurs !', 'info'); } },
      { t: 12, fn: function () { self.banner('👑 Arrivée des VIP : à traiter en priorité !', 'gold'); } },
      { t: 25, fn: function () { self.banner('☕ Rush de 9h : ça se bouscule dans le lobby !', 'warn'); } },
      { t: 48, fn: function () { self.banner('⏰ Dernière ligne droite avant le COPIL !', 'warn'); } }
    ];
    this.updateHud();
  };

  // ---------- écrans internes ----------
  P.showIntro = function () {
    var self = this;
    this.overlay.className = 'lb-overlay show';
    this.overlay.innerHTML =
      '<div class="lb-card intro">' +
      '<div class="lb-card-k">RDC · Mission 1</div>' +
      '<h2>Le Ballet des Ascenseurs</h2>' +
      '<p>8h57. Le consultant d\'accueil est en « off-site ». C\'est toi qui gères le lobby.</p>' +
      '<div class="intro-banks">' + this.banks.map(function (b) {
        return '<div style="--c:' + b.color + '"><b>' + b.id + '</b><span>Étages ' + b.min + '–' + b.max + '</span></div>';
      }).join('') + '</div>' +
      '<ul>' +
      '<li>🖱️ <b>Glisse-dépose</b> chaque client sur le bon groupe d\'ascenseurs.</li>' +
      '<li>⏱️ <b>10 secondes</b> par client avant qu\'il ne reparte furieux.</li>' +
      '<li>👑 Les <b>VIP</b> passent devant, sont plus pressés et rapportent double.</li>' +
      '<li>🔧 Un groupe <b>en panne</b> n\'accepte personne : ses clients patientent (chrono gelé).</li>' +
      '</ul>' +
      '<p class="goal">Objectif : <b>' + U.fmtNum(TARGET) + ' points</b> en <b>' + U.fmtTime(DURATION) + '</b>. Si la satisfaction tombe à 0 %, c\'est la porte.</p>' +
      '<button class="btn big" data-a="start">C\'est parti !</button>' +
      '</div>';
    this.overlay.querySelector('[data-a="start"]').onclick = function () { TG.sfx('click'); self.start(); };
  };

  P.start = function () {
    this.overlay.className = 'lb-overlay';
    this.overlay.innerHTML = '';
    this.running = true;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.loop);
  };

  P.togglePause = function () {
    if (!this.running || this.over) return;
    var self = this;
    this.paused = !this.paused;
    this.wrap.classList.toggle('paused', this.paused);
    if (this.paused) {
      this.overlay.className = 'lb-overlay show';
      this.overlay.innerHTML =
        '<div class="lb-card small"><h2>☕ Pause café</h2><p>Les clients attendent. Poliment. Pour l\'instant.</p>' +
        '<div class="row"><button class="btn" data-a="resume">Reprendre</button><button class="btn ghost dark" data-a="quit">Quitter la mission</button></div></div>';
      this.overlay.querySelector('[data-a="resume"]').onclick = function () { self.togglePause(); };
      this.overlay.querySelector('[data-a="quit"]').onclick = function () { self.ctx.quit(); };
    } else {
      this.overlay.className = 'lb-overlay';
      this.overlay.innerHTML = '';
      this.last = performance.now();
    }
  };

  P.onKey = function (e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') this.togglePause();
  };

  // ---------- boucle ----------
  P.loop = function (now) {
    if (!this.running) return;
    var dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    if (!this.paused) this.update(dt);
    if (this.running) this.raf = requestAnimationFrame(this.loop);
  };

  P.update = function (dt) {
    var self = this;
    this.elapsed += dt;
    this.time = Math.max(0, DURATION - this.elapsed);
    var p = Math.min(1, this.elapsed / DURATION);

    // événements scénarisés
    this.events.forEach(function (ev) { if (!ev.done && self.elapsed >= ev.t) { ev.done = true; ev.fn(); } });

    // arrivée des clients : de plus en plus vite, de plus en plus nombreux
    var maxQ = Math.min(MAX_QUEUE, 2 + Math.floor(this.elapsed / 9));
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      if (this.queue.length < maxQ) {
        this.spawn(p);
        this.spawnTimer = U.lerp(2.4, 0.9, p) * (0.8 + Math.random() * 0.4);
        if (this.elapsed > 25 && Math.random() < 0.3) this.spawnTimer = 0.4; // arrivées groupées
      } else {
        this.spawnTimer = 0.3;
      }
    }

    // pannes
    if (this.breakdown) {
      this.breakdown.left -= dt;
      this.breakdown.bank.el.querySelector('.lb-timer').textContent = Math.ceil(this.breakdown.left) + ' s';
      if (this.breakdown.left <= 0) this.endBreakdown();
    } else if (this.elapsed >= this.nextBreakdown && this.time > 6) {
      this.startBreakdown();
    }

    // patience des clients
    this.queue.slice().forEach(function (c) {
      var frozen = !!(self.breakdown && self.breakdown.bank === c.bank);
      if (frozen !== c.frozen) { c.frozen = frozen; c.el.classList.toggle('frozen', frozen); }
      if (!frozen) c.patience -= dt;
      var f = Math.max(0, c.patience / c.maxPatience);
      c.bar.style.width = (f * 100) + '%';
      var mood = f > 0.6 ? 'happy' : f > 0.3 ? 'neutral' : 'angry';
      if (mood !== c.mood) {
        c.mood = mood;
        TG.setMood(c.svg, mood);
        c.el.dataset.mood = mood;
      }
      c.el.classList.toggle('hurry', !frozen && c.patience < 3);
      if (c.patience <= 0) self.timeout(c);
    });

    // compte à rebours sonore
    var sec = Math.ceil(this.time);
    if (sec <= 10 && sec !== this.lastTick && sec > 0) { this.lastTick = sec; TG.sfx('tick'); }

    // humeur du consultant
    TG.setMood(this.playerSvg, this.sat > 60 ? 'happy' : this.sat > 30 ? 'neutral' : 'angry');

    this.updateHud();
    if (this.sat <= 0) this.end(true);
    else if (this.time <= 0) this.end(false);
  };

  P.updateHud = function () {
    var h = this.hud;
    h.served.textContent = this.served;
    h.errors.textContent = this.errors;
    h.sat.textContent = Math.round(this.sat) + ' %';
    h.sat.className = this.sat > 60 ? 'ok' : this.sat > 30 ? 'mid' : 'low';
    h.time.textContent = U.fmtTime(this.time);
    h.time.className = this.time <= 10 ? 'low blink' : this.time <= 30 ? 'mid' : '';
    h.score.textContent = U.fmtNum(this.score);
    this.scoreBar.style.width = Math.min(100, (this.score / TARGET) * 100) + '%';
    this.scoreBar.parentNode.classList.toggle('reached', this.score >= TARGET);
  };

  // ---------- clients ----------
  P.spawn = function (p) {
    var vipChance = this.elapsed < 12 ? 0 : 0.15 + 0.12 * p;
    var vip = Math.random() < vipChance;
    var bank = U.pick(this.banks);
    var floor = bank.min + Math.floor(Math.random() * (bank.max - bank.min + 1));
    var look = TG.randomLook();
    var c = {
      id: ++this.nextId, floor: floor, bank: bank, vip: vip,
      patience: vip ? VIP_PATIENCE : PATIENCE, maxPatience: vip ? VIP_PATIENCE : PATIENCE,
      mood: 'happy', state: 'queue', frozen: false
    };
    var e = U.el('div', 'client entering' + (vip ? ' vip' : ''));
    e.innerHTML =
      '<div class="cl-bubble"><small>Étage</small><b>' + floor + '</b></div>' +
      (vip ? '<div class="cl-vip">VIP</div>' : '') +
      '<div class="cl-body">' + TG.characterSVG(Object.assign(look, { vip: vip, mood: 'happy', briefcase: Math.random() < 0.6 })) + '</div>' +
      '<div class="cl-bar"><i></i></div><div class="cl-pause">⏸</div>';
    e.style.left = '1190px';
    e.style.top = CLIENT_TOP + 'px';
    this.clientsEl.appendChild(e);
    c.el = e;
    c.bar = e.querySelector('.cl-bar i');
    c.svg = e.querySelector('svg');
    var self = this;
    e.addEventListener('pointerdown', function (ev) { self.onDown(ev, c); });

    if (vip) {
      // les VIP passent devant tout le monde (sauf les autres VIP)
      var i = 0;
      while (i < this.queue.length && this.queue[i].vip) i++;
      this.queue.splice(i, 0, c);
    } else {
      this.queue.push(c);
    }
    void e.offsetWidth; // déclenche la transition d'entrée
    this.layout();
    this.later(function () { e.classList.remove('entering'); }, 700);
    TG.sfx('pop');
  };

  P.layout = function () {
    this.queue.forEach(function (c, i) {
      if (c.dragging) return;
      c.el.style.left = (SLOT_X0 + i * SLOT_DX) + 'px';
      c.el.style.top = CLIENT_TOP + 'px';
      c.el.style.zIndex = 20 - i;
    });
  };

  P.removeFromQueue = function (c) {
    var i = this.queue.indexOf(c);
    if (i >= 0) this.queue.splice(i, 1);
  };

  // ---------- glisser-déposer ----------
  P.toStage = function (e) {
    var r = this.wrap.getBoundingClientRect();
    var s = r.width / TG.STAGE_W;
    return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
  };

  P.bankAt = function (x, y) {
    if (y < 56 || y > DROP_Y_MAX) return null;
    for (var i = 0; i < this.banks.length; i++) {
      var b = this.banks[i];
      if (x >= b.x - 22 && x <= b.x + BANK_W + 22) return b;
    }
    return null;
  };

  P.hoverBank = function (bank) {
    this.banks.forEach(function (b) { b.el.classList.toggle('hover', b === bank); });
  };

  P.onDown = function (ev, c) {
    if (!this.running || this.paused || this.over || c.state !== 'queue' || c.dragging) return;
    ev.preventDefault();
    var self = this, el = c.el;
    c.dragging = true;
    el.classList.add('dragging');
    el.classList.remove('entering');
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ignoré */ }
    var p0 = this.toStage(ev);
    var offX = p0.x - parseFloat(el.style.left);
    var offY = p0.y - parseFloat(el.style.top);
    TG.sfx('pop');

    function move(e) {
      var q = self.toStage(e);
      el.style.left = (q.x - offX) + 'px';
      el.style.top = (q.y - offY) + 'px';
      self.hoverBank(self.bankAt(q.x, q.y));
    }
    function cleanup() {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      c.dragging = false;
      c.cleanupDrag = null;
      el.classList.remove('dragging');
      self.hoverBank(null);
    }
    function up(e) {
      var q = self.toStage(e);
      cleanup();
      if (c.state !== 'queue') return;
      self.drop(c, self.bankAt(q.x, q.y));
    }
    c.cleanupDrag = cleanup;
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  };

  P.drop = function (c, bank) {
    if (!bank || this.over) { this.layout(); return; }
    if (this.breakdown && this.breakdown.bank === bank) {
      this.popup(bank.x + BANK_W / 2, 250, 'En panne ! 🔧', 'warn');
      TG.sfx('error');
      this.layout();
      return;
    }
    if (bank === c.bank) this.serve(c);
    else this.wrong(c, bank);
  };

  P.serve = function (c) {
    var self = this, bank = c.bank;
    c.state = 'served';
    this.removeFromQueue(c);
    this.layout();

    var frac = Math.max(0, c.patience / c.maxPatience);
    this.streak++;
    this.bestStreak = Math.max(this.bestStreak, this.streak);
    var pts = 100 + Math.round(50 * frac) + 10 * Math.min(this.streak - 1, 5);
    if (c.vip) { pts *= 2; this.vipServed++; }
    this.score += pts;
    this.served++;
    this.sat = Math.min(100, this.sat + (c.vip ? 3 : 1));

    // choisir une cabine libre
    var now = performance.now(), idx = -1, d;
    var order = [0, 1, 2, 3, 4, 5].sort(function () { return Math.random() - 0.5; });
    for (d = 0; d < order.length; d++) if (bank.busy[order[d]] < now) { idx = order[d]; break; }
    if (idx < 0) idx = order[0];
    bank.busy[idx] = now + 1300;
    var elev = bank.elevs[idx];
    var ind = elev.querySelector('.lb-ind');
    var doorX = bank.x + idx * DOOR_STEP;

    elev.classList.add('open');
    ind.textContent = c.floor;
    ind.classList.add('lit');
    c.el.classList.add('boarding');
    c.el.style.left = (doorX + DOOR_W / 2 - 48) + 'px';
    c.el.style.top = '150px';
    c.el.style.zIndex = 4;
    TG.setMood(c.svg, 'happy');

    this.popup(doorX + DOOR_W / 2, 200, '+' + pts, c.vip ? 'gold' : 'good');
    if (this.streak >= 3 && this.streak % 3 === 0) this.popup(doorX + DOOR_W / 2, 150, 'Série ×' + this.streak + ' 🔥', 'combo');
    TG.sfx('ding');

    this.later(function () { c.el.classList.add('gone'); }, 520);
    this.later(function () { elev.classList.remove('open'); c.el.remove(); }, 1000);
    this.later(function () { elev.classList.add('going'); }, 1150);
    this.later(function () {
      elev.classList.remove('going');
      ind.classList.remove('lit');
      ind.textContent = idx % 2 ? '▼' : '▲';
    }, 2600);
  };

  P.wrong = function (c, bank) {
    var self = this;
    this.errors++;
    this.streak = 0;
    this.score = Math.max(0, this.score - 50);
    this.sat = Math.max(0, this.sat - 8);
    bank.el.classList.add('flash-bad');
    this.later(function () { bank.el.classList.remove('flash-bad'); }, 500);
    this.popup(bank.x + BANK_W / 2, 250, 'Mauvais groupe ! −50', 'bad');
    this.popup(bank.x + BANK_W / 2, 290, 'Étage ' + c.floor + ' ≠ ' + bank.min + '–' + bank.max, 'bad small');
    TG.sfx('error');
    TG.setMood(c.svg, 'angry');
    c.mood = 'angry';
    this.layout();
    c.el.classList.add('shake');
    this.later(function () { c.el.classList.remove('shake'); }, 600);
  };

  P.timeout = function (c) {
    var self = this;
    if (c.cleanupDrag) c.cleanupDrag();
    c.state = 'left';
    this.removeFromQueue(c);
    this.layout();
    this.errors++;
    this.streak = 0;
    var satLoss = c.vip ? 18 : 10;
    if (c.vip) this.vipLost++;
    this.sat = Math.max(0, this.sat - satLoss);
    this.score = Math.max(0, this.score - (c.vip ? 100 : 30));
    TG.setMood(c.svg, 'angry');
    this.popup(parseFloat(c.el.style.left) + 48, CLIENT_TOP - 20, (c.vip ? 'VIP parti ! ' : 'Client parti ! ') + '−' + satLoss + ' % 😤', 'bad');
    TG.sfx('leave');
    c.el.classList.add('leaving');
    c.el.style.left = '1380px';
    c.el.style.top = CLIENT_TOP + 'px';
    this.later(function () { c.el.remove(); }, 1500);
  };

  // ---------- pannes ----------
  P.startBreakdown = function () {
    var bank = U.pick(this.banks);
    this.breakdown = { bank: bank, left: 5 };
    bank.el.classList.add('broken');
    this.banner('🔧 Ascenseurs ' + bank.id + ' en panne ! Ses clients patientent.', 'warn');
    TG.sfx('alarm');
  };

  P.endBreakdown = function () {
    var bank = this.breakdown.bank;
    bank.el.classList.remove('broken');
    this.banner('✅ Ascenseurs ' + bank.id + ' réparés', 'good');
    this.breakdown = null;
    this.nextBreakdown = this.elapsed + 10 + Math.random() * 4;
  };

  // ---------- effets ----------
  P.popup = function (x, y, text, cls) {
    var p = U.el('div', 'lb-pop ' + (cls || ''), text);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    this.fxEl.appendChild(p);
    this.later(function () { p.remove(); }, 1300);
  };

  P.banner = function (text, cls) {
    var b = this.bannerEl;
    b.className = 'lb-banner';
    b.textContent = text;
    void b.offsetWidth;
    b.className = 'lb-banner show ' + (cls || '');
  };

  // ---------- fin ----------
  P.end = function (fired) {
    if (this.over) return;
    this.over = true;
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.queue.forEach(function (c) { if (c.cleanupDrag) c.cleanupDrag(); });
    var self = this;
    var success = !fired && this.score >= TARGET;
    this.updateHud();
    this.overlay.className = 'lb-overlay show';
    this.overlay.innerHTML =
      '<div class="lb-card small end">' +
      (fired
        ? '<h2>🚨 Satisfaction : 0 %</h2><p>Les RH t\'attendent au 32<sup>e</sup>. Prends ton badge.</p>'
        : '<h2>🏁 Fin de la journée</h2><p>' + (success ? 'Objectif atteint ! Le Partner a levé un sourcil (approbateur).' : 'Objectif manqué… La review risque d\'être « constructive ».') + '</p>') +
      '<div class="end-score">' + U.fmtNum(this.score) + ' <small>/ ' + U.fmtNum(TARGET) + '</small></div>' +
      '<p class="muted">Rédaction de ta Performance Review…</p></div>';
    TG.sfx(fired ? 'lose' : 'ding');
    this.later(function () {
      self.ctx.finish({
        score: self.score,
        target: TARGET,
        success: success,
        fired: fired,
        stats: [
          ['Clients accueillis', self.served],
          ['Erreurs', self.errors],
          ['Satisfaction finale', Math.round(self.sat) + ' %'],
          ['VIP servis', self.vipServed],
          ['Meilleure série', self.bestStreak]
        ],
        metrics: {
          served: self.served, errors: self.errors, sat: self.sat,
          vipServed: self.vipServed, vipLost: self.vipLost, bestStreak: self.bestStreak
        }
      });
    }, 2400);
  };

  P.destroy = function () {
    this.running = false;
    this.over = true;
    cancelAnimationFrame(this.raf);
    this.timers.forEach(clearTimeout);
    window.removeEventListener('keydown', this.onKey);
    this.root.innerHTML = '';
  };
})();

</script>
  <script>
/*
 * Mini-jeu 2 · Étage 1 · Coin café — « La Machine à Café »
 * Le consultant sort de l'ascenseur, traverse l'open space jusqu'à la machine (auto ou flèches),
 * zoom sur l'écran, choix du café, calcul mental en 10 secondes, une seule chance.
 */
(function () {
  'use strict';
  var TG = window.TowerGame;
  var U = TG.util;

  var TIME_LIMIT = 10;     // secondes pour répondre
  var TARGET = 300;        // une bonne réponse à l'Espresso, même à la dernière seconde
  var START_X = 45, STOP_X = 920;
  var ZOOM = { x: 1130, y: 340, s: 4.5 }; // centre de l'écran de la machine dans le décor

  // La difficulté du calcul dépend du café choisi.
  var COFFEES = [
    { id: 'espresso', name: 'Espresso', level: 1, label: 'Facile', color: '#3b2314', fill: 38 },
    { id: 'allonge', name: 'Allongé', level: 2, label: 'Tranquille', color: '#4a2c17', fill: 78 },
    { id: 'cappuccino', name: 'Cappuccino', level: 3, label: 'Moyen', color: '#7a4a2a', fill: 82, foam: '#f3e5d0' },
    { id: 'latte', name: 'Latte', level: 4, label: 'Costaud', color: '#b08257', fill: 86, foam: '#fbf3e6' },
    { id: 'mocaccino', name: 'Mocaccino', level: 5, label: 'Difficile', color: '#5a2e1a', fill: 86, foam: '#e8d3b8', choco: true }
  ];

  var RANGES = {
    1: { add: [[2, 20], [2, 20]], sub: [[10, 30], [1, 10]], mul: [[2, 5], [2, 9]] },
    2: { add: [[10, 50], [5, 30]], sub: [[20, 60], [5, 20]], mul: [[2, 9], [2, 6]] },
    3: { add: [[20, 80], [10, 60]], sub: [[50, 120], [15, 60]], mul: [[3, 9], [3, 9]] },
    4: { add: [[30, 99], [20, 99]], sub: [[100, 160], [25, 90]], mul: [[6, 12], [3, 9]] },
    5: { add: [[100, 250], [40, 99]], sub: [[120, 250], [45, 99]], mul: [[11, 15], [3, 9]] }
  };

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function makeQuestion(level) {
    var r = RANGES[level];
    var op = U.pick(['add', 'sub', 'mul']);
    var a = rnd(r[op][0][0], r[op][0][1]);
    var b = rnd(r[op][1][0], r[op][1][1]);
    if (op === 'sub' && b > a) { var t = a; a = b; b = t; }
    var sym = { add: '+', sub: '−', mul: '×' }[op];
    var ans = op === 'add' ? a + b : op === 'sub' ? a - b : a * b;
    return { text: a + ' ' + sym + ' ' + b, answer: ans };
  }

  function fmtSec(s) { return s.toFixed(1).replace('.', ','); }

  var CHATTER = [
    'On se cale un point ?', 'T\'as vu le mail du Partner ?', 'Je suis en call…', 'C\'est quoi le next step ?',
    'On challenge ça ensemble ?', 'Tu peux me faire un quick win ?', 'J\'ai 3 COPIL aujourd\'hui', 'ASAP stp 🙏'
  ];

  TG.registerFloor({
    id: 'coffee',
    order: 5,
    floorNumber: 1,
    floorLabel: 'Étage 1',
    name: 'Coin café',
    title: 'La Machine à Café',
    icon: '☕',
    tagline: 'La machine ne sert que ceux qui savent compter. Un calcul mental, 10 secondes, une seule chance.',
    target: TARGET,
    start: function (root, ctx) { return new Coffee(root, ctx); },
    reviewQuotes: {
      below: ['Pas de café, pas d\'impact. Le lien de causalité est établi.',
        'A tenté de négocier avec la machine à café. La machine n\'a pas cédé.'],
      meets: ['Café obtenu. Solid performance. Could demonstrate more ownership in caffeine intake.'],
      exceeds: ['Calcul mental impeccable. A été repéré pour les business cases.'],
      outstanding: ['Plus rapide que la calculette du DAF. Le comité est sous le choc.',
        'La machine à café a demandé à travailler sur ses missions.']
    },
    reviewComments: function (r) {
      var m = r.metrics || {}, out = [];
      if (r.success) {
        out.push('A résolu ' + m.question + ' en ' + fmtSec(m.time) + ' s. Le DAF est impressionné.');
        if (m.time < 3) out.push('Réflexes de trader. Attention à ne pas devenir trader.');
      } else if (m.timeout) {
        out.push('Aucune réponse en 10 secondes. Diagnostic : paralysie décisionnelle pré-caféine.');
      } else {
        out.push('A répondu ' + m.given + ' à « ' + m.question + ' » (attendu : ' + m.answer + '). La machine a ouvert un ticket.');
      }
      if (m.level >= 5) out.push('Le choix du Mocaccino démontre un vrai appétit pour le risque.');
      else if (m.level === 1) out.push('Choix de l\'Espresso : prudent. Peut-être un peu trop.');
      if (m.attempts > 3) out.push(m.attempts + ' passages à la machine en une matinée. Le manager a remarqué.');
      return out;
    }
  });

  // ======================================================================
  function Coffee(root, ctx) {
    this.root = root;
    this.ctx = ctx;
    this.timers = [];
    this.keys = {};
    this.state = 'intro';
    this.attempts = 0;
    this.coffee = null;
    this.loop = this.loop.bind(this);
    this.onKeyDown = this.onKeyDown.bind(this);
    this.onKeyUp = this.onKeyUp.bind(this);
    this.build();
    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
    this.showIntro();
  }
  var P = Coffee.prototype;

  P.later = function (fn, ms) { var id = setTimeout(fn, ms); this.timers.push(id); return id; };

  // ---------- décor ----------
  P.build = function () {
    var w = (this.wrap = U.el('div', 'coffee'));
    var desks = [250, 520, 790].map(function (x, i) {
      return '<div class="cf-desk" style="left:' + x + 'px">' +
        '<div class="cf-worker">' + TG.characterSVG({ mood: U.pick(['happy', 'neutral']) }) + '</div>' +
        '<div class="cf-monitor"><span>' + ['PPT', 'XLS', 'KPI'][i] + '</span></div>' +
        '<div class="cf-mug"></div>' +
        '<div class="cf-desk-top"></div><div class="cf-desk-leg l"></div><div class="cf-desk-leg r"></div>' +
        '<div class="cf-talk"></div></div>';
    }).join('');
    var blds = '';
    for (var b = 0; b < 9; b++) {
      blds += '<div class="bld" style="left:' + (b * 50 - 10) + 'px;width:' + (36 + (b * 17) % 30) + 'px;height:' + (70 + (b * 53) % 150) + 'px;--b:' + ['#7c9cc4', '#6b8bb3', '#8fb0d6'][b % 3] + '"></div>';
    }
    var keys = '';
    for (var k = 0; k < 9; k++) keys += '<i></i>';

    w.innerHTML =
      '<div class="cf-world">' +
      '<div class="cf-wall">' +
      '<div class="cf-window"><div class="cf-sky"></div>' + blds + '<div class="cf-mullions"></div></div>' +
      '<div class="cf-board"><b>SYNERGIES</b><span>ROI ↗ · KPI · ASAP</span><span>→ Think out of the box</span><svg viewBox="0 0 200 60"><path d="M10 50 L50 35 L90 42 L130 20 L180 8" stroke="#e63946" stroke-width="4" fill="none"/></svg></div>' +
      '<div class="cf-clock"><i class="h"></i><i class="m"></i></div>' +
      '<div class="cf-floor-sign">ÉTAGE 1 · OPEN SPACE</div>' +
      '</div>' +
      '<div class="cf-ground"></div>' +
      '<div class="cf-elevator"><div class="cf-el-ind">RDC</div><div class="cf-el-shaft"><div class="cf-el-cabin"></div><div class="cf-el-leaf l"></div><div class="cf-el-leaf r"></div></div></div>' +
      desks +
      '<div class="cf-plant"><i></i></div>' +
      '<div class="cf-machine">' +
      '<div class="cf-m-top">CAFÉ</div>' +
      '<div class="cf-m-screen"><span>☕ ?</span></div>' +
      '<div class="cf-m-keys">' + keys + '</div>' +
      '<div class="cf-m-slot"><div class="cf-m-nozzle"></div></div>' +
      '<div class="cf-m-tray"></div>' +
      '</div>' +
      '<div class="cf-player"><div class="cf-player-inner">' + TG.characterSVG({ player: true, mood: 'happy' }) + '</div></div>' +
      '</div>' +
      '<div class="cf-hint">→ Maintiens la flèche droite pour aller plus vite (ou laisse-toi porter)</div>' +
      '<div class="cf-ui">' +
      '<div class="cf-face">' +
      '<div class="cf-brand">BARISTA 3000 <small>· Paiement accepté : 1 neurone</small></div>' +
      '<div class="cf-screen"><div class="cf-screen-inner"></div></div>' +
      '<div class="cf-alcove"><div class="cf-nozzle"></div><div class="cf-stream"></div>' +
      '<div class="cf-steam"><i></i><i></i><i></i></div>' +
      '<div class="cf-cup"><div class="cf-liquid"><div class="cf-foam"></div></div><div class="cf-handle"></div></div>' +
      '<div class="cf-tray"></div></div>' +
      '<div class="cf-pad">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button class="cf-key" data-k="' + n + '">' + n + '</button>'; }).join('') +
      '<button class="cf-key del" data-k="del">Effacer</button><button class="cf-key" data-k="0">0</button><button class="cf-key ok" data-k="ok">Valider</button>' +
      '</div>' +
      '<div class="cf-verdict"></div>' +
      '</div></div>' +
      '<div class="cf-overlay"></div>' +
      '<button class="cf-quit">✕ Quitter</button>';
    this.root.appendChild(w);

    this.world = w.querySelector('.cf-world');
    this.player = w.querySelector('.cf-player');
    this.playerSvg = this.player.querySelector('svg');
    this.elevator = w.querySelector('.cf-elevator');
    this.hint = w.querySelector('.cf-hint');
    this.ui = w.querySelector('.cf-ui');
    this.face = w.querySelector('.cf-face');
    this.screen = w.querySelector('.cf-screen-inner');
    this.cup = w.querySelector('.cf-cup');
    this.liquid = w.querySelector('.cf-liquid');
    this.foam = w.querySelector('.cf-foam');
    this.alcove = w.querySelector('.cf-alcove');
    this.verdict = w.querySelector('.cf-verdict');
    this.overlay = w.querySelector('.cf-overlay');
    this.talks = Array.prototype.slice.call(w.querySelectorAll('.cf-desk')).map(function (d) {
      return { x: parseFloat(d.style.left), el: d.querySelector('.cf-talk'), done: false };
    });

    var self = this;
    w.querySelectorAll('.cf-key').forEach(function (btn) {
      btn.addEventListener('click', function () { self.press(btn.dataset.k); });
    });
    w.querySelector('.cf-quit').onclick = function () { self.ctx.quit(); };
    this.x = START_X;
    this.player.style.left = this.x + 'px';
  };

  // ---------- 1. intro : l'ascenseur monte d'un étage ----------
  P.showIntro = function () {
    var self = this;
    this.overlay.className = 'cf-overlay show';
    this.overlay.innerHTML =
      '<div class="cf-card">' +
      '<div class="cf-card-k">Étage 1 · Mission 2</div>' +
      '<h2>☕ La Machine à Café</h2>' +
      '<p>9h04. Sans café, pas de slides. Mais la machine de l\'étage 1 ne sert que ceux qui savent compter.</p>' +
      '<ul>' +
      '<li>🚶 Traverse l\'open space jusqu\'à la machine (tout seul, ou plus vite avec <b>→</b>).</li>' +
      '<li>☕ Choisis ton café : plus il est corsé, plus le calcul est dur (et rapporte).</li>' +
      '<li>⏱️ <b>10 secondes</b> pour taper le résultat. <b>Une seule chance.</b></li>' +
      '<li>⌨️ Pavé de la machine à la souris, ou clavier (chiffres, Retour arrière, Entrée).</li>' +
      '</ul>' +
      '<button class="btn big" data-a="go">Monter à l\'étage ▲</button></div>';
    this.overlay.querySelector('[data-a="go"]').onclick = function () { TG.sfx('click'); self.rideUp(); };
  };

  P.rideUp = function () {
    var self = this;
    this.overlay.className = 'cf-overlay';
    this.overlay.innerHTML = '';
    this.state = 'ride';
    var ind = this.elevator.querySelector('.cf-el-ind');
    ind.classList.add('moving');
    this.later(function () { ind.textContent = '1'; ind.classList.remove('moving'); TG.sfx('ding'); }, 900);
    this.later(function () { self.elevator.classList.add('open'); self.player.classList.add('visible'); }, 1200);
    this.later(function () {
      self.state = 'walk';
      self.hint.classList.add('show');
      self.last = performance.now();
      self.raf = requestAnimationFrame(self.loop);
    }, 1800);
  };

  // ---------- boucle (marche + chrono) ----------
  P.loop = function (now) {
    var dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    if (this.state === 'walk') this.updateWalk(dt);
    else if (this.state === 'question') this.updateTimer();
    if (this.state === 'walk' || this.state === 'question') this.raf = requestAnimationFrame(this.loop);
  };

  // ---------- 2. la marche dans l'open space ----------
  P.updateWalk = function (dt) {
    var speed = 170;                       // déplacement automatique
    if (this.keys.ArrowRight) speed = 340; // plus vite avec la flèche droite
    if (this.keys.ArrowLeft) speed = -220; // on peut reculer
    this.x = U.clamp(this.x + speed * dt, START_X, STOP_X);
    this.player.style.left = this.x + 'px';
    this.player.classList.toggle('back', speed < 0);
    this.player.classList.add('walking');

    var self = this;
    this.talks.forEach(function (t) {
      if (!t.done && self.x > t.x - 40) {
        t.done = true;
        t.el.textContent = U.pick(CHATTER);
        t.el.classList.add('show');
        self.later(function () { t.el.classList.remove('show'); }, 2200);
      }
    });
    if (this.x >= STOP_X) this.arrive();
  };

  // ---------- 3. zoom fluide sur l'écran de la machine ----------
  P.arrive = function () {
    var self = this;
    this.state = 'zoom';
    this.player.classList.remove('walking', 'back');
    this.hint.classList.remove('show');
    this.wrap.querySelector('.cf-machine').classList.add('awake');
    TG.sfx('pop');
    this.later(function () {
      var tx = 640 - ZOOM.x * ZOOM.s, ty = 360 - ZOOM.y * ZOOM.s;
      self.world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + ZOOM.s + ')';
      self.world.classList.add('zoomed');
    }, 350);
    this.later(function () { self.ui.classList.add('show'); self.showMenu(); }, 1750);
  };

  // ---------- 4. menu des cafés ----------
  P.showMenu = function () {
    var self = this;
    this.state = 'menu';
    this.face.classList.remove('win', 'lose');
    this.setVerdict('');
    this.resetCup();
    this.setPad(false);
    this.screen.className = 'cf-screen-inner menu';
    this.screen.innerHTML =
      '<div class="sc-title">Choisis ton café</div>' +
      '<div class="sc-menu">' + COFFEES.map(function (c, i) {
        return '<button class="sc-coffee" data-i="' + i + '"><span class="sc-k">' + (i + 1) + '</span>' +
          '<span class="sc-cup" style="--cc:' + c.color + ';--cf:' + (c.foam || c.color) + '"></span>' +
          '<b>' + c.name + '</b><span class="sc-dots">' + '●'.repeat(c.level) + '<em>' + '●'.repeat(5 - c.level) + '</em></span>' +
          '<small>' + c.label + '</small></button>';
      }).join('') + '</div>' +
      '<div class="sc-foot">Clic ou touches 1 à 5 · plus c\'est corsé, plus le calcul est dur</div>';
    this.screen.querySelectorAll('.sc-coffee').forEach(function (b) {
      b.onclick = function () { self.choose(COFFEES[+b.dataset.i]); };
    });
  };

  // ---------- 5. calcul mental + chrono ----------
  P.choose = function (coffee) {
    this.coffee = coffee;
    this.ask();
  };

  P.ask = function () {
    this.state = 'question';
    this.attempts++;
    this.q = makeQuestion(this.coffee.level);
    this.input = '';
    this.face.classList.remove('win', 'lose');
    this.setVerdict('');
    this.resetCup();
    this.setPad(true);
    TG.sfx('click');
    this.screen.className = 'cf-screen-inner question';
    this.screen.innerHTML =
      '<div class="sc-name">' + this.coffee.name + ' <small>' + this.coffee.label + '</small></div>' +
      '<div class="sc-q">' + this.q.text + ' = <span class="sc-ans"></span></div>' +
      '<div class="sc-timer"><i></i></div>' +
      '<div class="sc-sec"><b>10,0</b> s</div>' +
      '<div class="sc-foot">Une seule chance · Entrée = Valider · Retour arrière = Effacer</div>';
    this.ansEl = this.screen.querySelector('.sc-ans');
    this.barEl = this.screen.querySelector('.sc-timer i');
    this.secEl = this.screen.querySelector('.sc-sec b');
    this.renderInput();
    this.deadline = performance.now() + TIME_LIMIT * 1000;
    this.lastSec = TIME_LIMIT;
    this.last = performance.now();
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(this.loop);
  };

  P.updateTimer = function () {
    var left = Math.max(0, (this.deadline - performance.now()) / 1000);
    var f = left / TIME_LIMIT;
    this.barEl.style.width = (f * 100) + '%';
    this.barEl.parentNode.className = 'sc-timer ' + (f > 0.5 ? 'ok' : f > 0.25 ? 'mid' : 'low');
    this.secEl.textContent = fmtSec(left);
    var s = Math.ceil(left);
    if (s !== this.lastSec && s <= 3 && s > 0) { this.lastSec = s; TG.sfx('tick'); }
    if (left <= 0) this.resolve(null);
  };

  P.renderInput = function () {
    this.ansEl.innerHTML = this.input ? this.input + '<i class="caret"></i>' : '<span class="ph">?</span><i class="caret"></i>';
  };

  P.press = function (k) {
    if (this.state !== 'question') return;
    if (k === 'del') {
      this.input = this.input.slice(0, -1);
      TG.sfx('click');
    } else if (k === 'ok') {
      if (!this.input) { // réponse vide : on ne consomme pas l'unique essai
        var qEl = this.screen.querySelector('.sc-q');
        TG.sfx('error');
        qEl.classList.remove('nudge'); void qEl.offsetWidth; qEl.classList.add('nudge');
        return;
      }
      this.resolve(parseInt(this.input, 10));
      return;
    } else if (/^[0-9]$/.test(k) && this.input.length < 4) {
      this.input = (this.input === '0' ? '' : this.input) + k;
      TG.sfx('tick');
    }
    this.renderInput();
    var key = this.wrap.querySelector('.cf-key[data-k="' + k + '"]');
    if (key) { key.classList.add('pressed'); this.later(function () { key.classList.remove('pressed'); }, 120); }
  };

  // ---------- 6. verdict : une seule chance ----------
  P.resolve = function (given) {
    var self = this;
    var left = Math.max(0, (this.deadline - performance.now()) / 1000);
    var timeout = given === null;
    var ok = !timeout && given === this.q.answer;
    this.state = 'result';
    cancelAnimationFrame(this.raf);
    this.setPad(false);
    var c = this.coffee;
    var score = ok ? 200 + 100 * c.level + Math.round(left * 30) : 0;
    this.lastResult = {
      score: score, target: TARGET, success: ok, fired: false,
      stats: [
        ['Café choisi', c.name + ' (' + c.label.toLowerCase() + ')'],
        ['Calcul', this.q.text + ' = ' + this.q.answer],
        ['Ta réponse', timeout ? '— (temps écoulé)' : given],
        ['Temps de réponse', timeout ? '10 s' : fmtSec(TIME_LIMIT - left) + ' s'],
        ['Passages à la machine', this.attempts]
      ],
      metrics: {
        coffee: c.name, level: c.level, question: this.q.text, answer: this.q.answer,
        given: given, time: TIME_LIMIT - left, timeout: timeout, attempts: this.attempts
      }
    };

    var actions = '<div class="sc-actions">' +
      '<button class="btn" data-a="again">↻ Rejouer</button>' +
      '<button class="btn ghost" data-a="menu">Changer de café</button>' +
      '<button class="btn blue" data-a="done">Retour au bureau →</button></div>';

    if (ok) {
      this.face.classList.add('win');
      this.screen.className = 'cf-screen-inner result win';
      this.screen.innerHTML =
        '<div class="sc-big">✔ BONNE RÉPONSE</div>' +
        '<div class="sc-sub">' + this.q.text + ' = ' + this.q.answer + ' · en ' + fmtSec(TIME_LIMIT - left) + ' s · +' + score + ' pts</div>' +
        '<div class="sc-msg">Préparation de ton ' + c.name + '…</div>' + actions;
      this.pour();
      TG.sfx('ding');
      this.later(function () {
        var m = self.screen.querySelector('.sc-msg');
        if (m) m.textContent = '☕ Ton ' + c.name + ' est prêt. Victoire, tu as mérité ta pause !';
        self.setVerdict('VICTOIRE !', 'ok');
        TG.sfx('win');
      }, 2300);
    } else {
      this.face.classList.add('lose');
      this.screen.className = 'cf-screen-inner result lose';
      this.screen.innerHTML =
        '<div class="sc-big">✖ PAS DE CAFÉ POUR TOI</div>' +

 * ----------------------------------------------------------------------------

 * ============================================================================
 *  Interface publique (seul nom exposé : window.PptShortcuts) :

 *    var game = PptShortcuts.createGame(container, {

 *      sfx:        function (name) {},         // optionnel : sons fournis par l'hôte
 *      onQuit:     function () {},             // optionnel : bouton « Quitter » sur l'accueil
 *      endActions: [{ label, primary, onClick }] // optionnel : boutons en plus sur l'écran de fin
 *    });

 *    game.destroy();  // retire tout (DOM, écouteurs, verrouillage clavier)

 *    PptShortcuts.loadConfig(config) -> { pools, excluded, errors }   (vérification de la banque)

 *  Le jeu dessine une planche de 1280 x 720 px mise à l'échelle dans `container`.
 *  Pendant une partie, TOUTES les touches sont interceptées (capture + preventDefault) ;
 *  sur l'accueil et l'écran de fin, le navigateur retrouve son comportement normal.

      if (u === 'ctrl' || u === 'control' || u === 'cmd' || u === 'ctl') c.ctrl = true;
      else if (u === 'maj' || u === 'shift') c.shift = true;
      else if (u === 'alt') c.alt = true;
