<style>
html, body { margin: 0; height: 100%; background: #201f1e; overflow: hidden; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
/* ===== Raccourcis Hero (PowerPoint × jeu de rythme) — toutes les classes sont préfixées pptg- ===== */
.pptg {
  position: relative; width: 100%; height: 100%; overflow: hidden; overflow: clip; background: #201f1e;

  position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
  font-family: 'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, Roboto, Arial, sans-serif; color: #252423; background: #e6e6e6;
}
.pptg, .pptg *, .pptg *::before, .pptg *::after { box-sizing: border-box; }
.pptg-board button { font-family: inherit; cursor: pointer; }

/* barre de titre + ruban */
.pptg-titlebar { height: 32px; background: #b7472a; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 0 0 10px; font-size: 13px; }

.pptg-tabs span { color: #fff; font-size: 13px; padding: 5px 13px; border-radius: 4px 4px 0 0; }

.pptg-ribbon { height: 88px; background: #f3f2f1; border-bottom: 1px solid #d2d0ce; display: flex; align-items: stretch; padding: 6px 10px; gap: 4px; }
.pptg-group { display: flex; flex-direction: column; justify-content: space-between; padding: 0 12px; border-right: 1px solid #d2d0ce; }
.pptg-group small { font-size: 11px; color: #605e5c; text-align: center; }
.pptg-gicons { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #323130; }
.pptg-gicons b { font-size: 30px; }
.pptg-gicons span { line-height: 1.15; }
.pptg-gicons.font span { width: 24px; height: 24px; border: 1px solid #c8c6c4; border-radius: 3px; display: flex; align-items: center; justify-content: center; background: #fff; }

/* HUD dans le ruban */
.pptg-hud { margin-left: auto; display: flex; gap: 10px; align-items: center; padding-right: 4px; }
.pptg-hud-box { position: relative; min-width: 122px; height: 70px; border-radius: 10px; background: #fff; border: 2px solid #e1dfdd; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pptg-hud-box small { position: relative; z-index: 2; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #8a8886; font-weight: 700; }
.pptg-hud-box b { position: relative; z-index: 2; font-size: 30px; line-height: 1; color: #b7472a; font-variant-numeric: tabular-nums; }
.pptg-hud-box b.bump { animation: pptgBump .4s; }
@keyframes pptgBump { 40% { transform: scale(1.35); color: #ff6a1a; } }
.pptg-hud-box.combo { overflow: visible; }
.pptg-flame { position: absolute; left: 0; right: 0; bottom: 0; height: 0; z-index: 1; pointer-events: none; transition: height .3s; }
.pptg-flame i { position: absolute; bottom: 0; width: 46px; height: 100%; border-radius: 50% 50% 35% 35%; background: radial-gradient(ellipse at 50% 90%, #fff3b0, #ffb703 30%, #ff6a1a 60%, rgba(255, 60, 0, 0) 75%); filter: blur(1px); animation: pptgFlick .35s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.pptg-flame i:nth-child(1) { left: 8px; animation-delay: -.1s; }
.pptg-flame i:nth-child(2) { left: 38px; height: 125%; animation-delay: -.2s; }
.pptg-flame i:nth-child(3) { right: 8px; }
@keyframes pptgFlick { from { transform: scaleY(.85) skewX(-4deg); } to { transform: scaleY(1.12) skewX(5deg); } }
.pptg-hud-box.combo.warm { border-color: #ffb703; }
.pptg-hud-box.combo.warm .pptg-flame { height: 40px; }
.pptg-hud-box.combo.hot { border-color: #ff6a1a; background: #fff4ec; }
.pptg-hud-box.combo.hot .pptg-flame { height: 70px; bottom: 4px; }
.pptg-hud-box.combo.max { border-color: #e81123; background: #ffe9e0; animation: pptgHeat .5s infinite alternate; }
.pptg-hud-box.combo.max .pptg-flame { height: 100px; bottom: 6px; }
.pptg-hud-box.combo.hot b, .pptg-hud-box.combo.max b { color: #c50f1f; text-shadow: 0 0 10px #fff; }
@keyframes pptgHeat { to { box-shadow: 0 0 22px rgba(255, 90, 0, .8); } }

/* zone principale */
.pptg-main { position: absolute; left: 0; right: 0; top: 150px; bottom: 28px; display: flex; }
.pptg-thumbs { width: 170px; background: #f3f2f1; border-right: 1px solid #d2d0ce; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.pptg-thumb { display: flex; align-items: center; gap: 6px; height: 46px; }
.pptg-thumb > span { width: 18px; font-size: 12px; color: #605e5c; text-align: right; }
.pptg-mini { flex: 1; height: 44px; background: #fff; border: 1px solid #c8c6c4; border-left: 5px solid #c8c6c4; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; transition: background .3s; }
.pptg-thumb.lv-facile .pptg-mini { border-left-color: #107c10; }
.pptg-thumb.lv-intermediaire .pptg-mini { border-left-color: #ca5010; }
.pptg-thumb.lv-difficile .pptg-mini { border-left-color: #a4262c; }
.pptg-thumb.current .pptg-mini { outline: 3px solid #c43e1c; outline-offset: 1px; color: #c43e1c; }
.pptg-thumb.phase1 .pptg-mini { background: #dff6dd; color: #107c10; }
.pptg-thumb.phase2 .pptg-mini { background: #fff4ce; color: #8a6100; }
.pptg-thumb.missed .pptg-mini { background: #fde7e9; color: #a4262c; }

.pptg-stagearea { position: relative; flex: 1; background: #e6e6e6; }
.pptg-slide {

.pptg-slide.flash-ok::after { background: radial-gradient(circle, rgba(16, 124, 16, .0) 40%, rgba(16, 124, 16, .35)); animation: pptgFlash .6s; }
.pptg-slide.flash-ko::after { background: rgba(232, 17, 35, .22); animation: pptgFlash .45s; }
@keyframes pptgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

.pptg-qhead { display: flex; justify-content: space-between; align-items: center; }
.pptg-level { font-size: 13px; font-weight: 700; color: #fff; padding: 3px 12px; border-radius: 20px; letter-spacing: .5px; background: #107c10; }

.pptg-timer { position: relative; height: 24px; border-radius: 12px; background: #edebe9; overflow: hidden; flex: none; }
.pptg-timer i { display: block; height: 100%; width: 100%; border-radius: 12px; }

/* la « piste » façon jeu de rythme */
.pptg-track { position: relative; flex: 1; min-height: 190px; border-radius: 10px; overflow: hidden; background: linear-gradient(#141313, #2d2c2b); box-shadow: inset 0 0 30px rgba(0, 0, 0, .6); }
.pptg-lanes {

    repeating-linear-gradient(90deg, transparent 0 148px, rgba(255, 255, 255, .07) 148px 150px),

  animation: pptgScroll 1.4s linear infinite;
}

@keyframes pptgScroll { from { background-position: 0 0, 0 0; } to { background-position: 0 0, 0 32px; } }
.pptg-line { position: absolute; left: 0; right: 0; bottom: 59px; height: 6px; background: #ff8c42; box-shadow: 0 0 14px 3px rgba(255, 120, 40, .8); }

.pptg-notes { position: absolute; inset: 0; }
.pptg-note { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; transition: bottom .35s cubic-bezier(.3, .7, .3, 1); white-space: nowrap; }
.pptg-note em { font-style: normal; color: #ffb27d; font-weight: 800; font-size: 15px; margin-right: 4px; width: 22px; height: 22px; border: 2px solid #ffb27d; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.pptg-plus { font-style: normal; color: #ffb27d; font-weight: 800; font-size: 20px; }
.pptg-cap {
  min-width: 62px; height: 56px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; color: #252423; background: linear-gradient(#ffffff, #e1dfdd); border-bottom: 5px solid #a19f9d;
}
.pptg-note .pptg-cap { color: #fff; text-shadow: 0 1px 2px rgba(80, 20, 0, .8); background: linear-gradient(#ff9a5a, #e8560c); border-bottom-color: #a33c0b; box-shadow: 0 0 18px rgba(255, 120, 40, .75); }
.pptg-note.blind .pptg-cap { background: linear-gradient(#605e5c, #3b3a39); border-bottom-color: #201f1e; box-shadow: none; color: #c8c6c4; min-width: 120px; }
.pptg-note.current:not(.blind) .pptg-cap { animation: pptgPulse .5s infinite alternate; }
@keyframes pptgPulse { to { box-shadow: 0 0 30px 6px rgba(255, 150, 60, 1); transform: translateY(-2px); } }
.pptg-note:not(.current):not(.done):not(.missed):not(.blind) { opacity: .55; }
.pptg-note.done { animation: pptgBurst .6s forwards; }
.pptg-note.done .pptg-cap { background: linear-gradient(#9ff59b, #16a516); border-bottom-color: #0b5a0b; box-shadow: 0 0 24px rgba(60, 255, 60, .9); }
@keyframes pptgBurst { 0% { opacity: 1; transform: translateX(-50%) scale(1); } 60% { opacity: 1; transform: translateX(-50%) scale(1.15); } 100% { opacity: 0; transform: translateX(-50%) scale(1.35); } }
.pptg-note.missed .pptg-cap { background: linear-gradient(#ff9a9a, #d92b2b); border-bottom-color: #7a1010; box-shadow: 0 0 18px rgba(255, 60, 60, .7); }
.fall .pptg-note { animation: pptgFall .7s cubic-bezier(.35, .1, .45, 1) backwards; }
.fall .pptg-note[data-i="1"] { animation-delay: .12s; }
@keyframes pptgFall { from { opacity: 0; transform: translate(-50%, -260px); } 70% { opacity: 1; } to { transform: translate(-50%, 0); } }
.pptg-steps { position: absolute; right: 14px; top: 10px; color: #c8c6c4; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.pptg-steps span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #605e5c; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #c8c6c4; }

.pptg-held { display: flex; align-items: center; gap: 8px; flex: none; }

.pptg-typed { margin-left: 10px; font-size: 18px; font-weight: 700; color: #8a8886; }
.pptg-typed.ok { color: #107c10; }
.pptg-typed.ko { color: #e81123; }

/* points gagnés */
.pptg-pop { position: absolute; left: 0; right: 0; top: 200px; text-align: center; pointer-events: none; opacity: 0; z-index: 5; }

@keyframes pptgPop { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }

/* accueil */
.pptg-slide.home { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fff 55%, #fbe4d9); }
.pptg-home { text-align: center; max-width: 760px; }

.pptg-row { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 12px; flex-wrap: wrap; }

.pptg-btn { border: 0; border-radius: 8px; padding: 12px 24px; font-size: 18px; font-weight: 700; color: #fff; background: #c43e1c; box-shadow: 0 4px 0 #8a2a12; transition: transform .08s, filter .15s; }
.pptg-btn:hover { filter: brightness(1.1); }
.pptg-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a2a12; }

<!-- ===== CONFIGURATION (modifiable sans toucher au jeu) ===== -->
<script>
/*
 * ============================================================================
 *  BANQUE DE RACCOURCIS POWERPOINT (Windows) · Raccourcis Hero
 *  Ce fichier est la SEULE chose à modifier pour changer les questions.
 *  La logique du jeu (ppt-game.js) le lit et le vérifie au chargement.
 * ============================================================================
 *
 *  Une entrée = { label, combos, level }
 *    label  : l'action affichée au joueur (sans le raccourci !)
 *    combos : liste des combinaisons à taper DANS L'ORDRE
 *             1 combinaison  -> question simple
 *             2 combinaisons -> enchaînement (niveau difficile)
 *    level  : 'facile' | 'intermediaire' | 'difficile'
 *
 *  Syntaxe d'une combinaison : modificateurs + touche, séparés par « + »
 *    modificateurs : Ctrl, Maj (ou Shift), Alt      -> Cmd (Mac) compte comme Ctrl
 *    touche        : une lettre a-z, un chiffre 0-9, ou F1 à F12
 *    exemples      : 'Ctrl+C', 'Ctrl+Maj+V', 'Ctrl+Alt+V', 'F5', 'Maj+F5'
 *
 *  Vérification automatique au chargement : toute entrée qui contient une combinaison de la liste
 *  `forbidden` (raccourcis que le navigateur ne laisse pas intercepter), la touche Windows, ou une
 *  syntaxe invalide est EXCLUE de la partie (un avertissement est écrit dans la console).
 *
 * ----------------------------------------------------------------------------
 *  NEUTRALISATION PAR NAVIGATEUR (Windows)
 *  Tous les raccourcis de cette banque sont, à notre connaissance, interceptables avec
 *  preventDefault() sur keydown dans Chrome, Edge et Firefox (aucun n'est « réservé » par le
 *  navigateur). Ce point n'a PAS été vérifié à la main sur les trois navigateurs : faites-le avec
 *  le « Test des raccourcis » de l'écran d'accueil, qui liste chaque combinaison de la banque.
 *  Points d'attention connus, à confirmer avec ce test :
 *    - Ctrl+Maj+C   : ouvre l'inspecteur des outils de développement (Chrome, Edge, Firefox)
 *                     si l'événement n'est pas bloqué ; bloqué tant que la page a le focus.
 *    - Ctrl+Alt+V   : en AZERTY, Alt Gr envoie Ctrl+Alt ; Alt Gr+V est donc accepté comme Ctrl+Alt+V.

 *      onQuit:     function () {},             // optionnel : bouton « Quitter » sur l'accueil
 *      endActions: [{ label, primary, onClick }] // optionnel : boutons en plus sur l'écran de fin
 *    });

 *    game.destroy();  // retire tout (DOM, écouteurs, verrouillage clavier)

 *  Pendant une partie, TOUTES les touches sont interceptées (capture + preventDefault) ;
 *  sur l'accueil et l'écran de fin, le navigateur retrouve son comportement normal.
 *  Échap est la seule touche réservée : elle met la partie en pause.
 */

  var MODIFIER_KEYS = ['Control', 'Shift', 'Alt', 'Meta', 'AltGraph', 'OS', 'CapsLock', 'Fn', 'FnLock', 'NumLock', 'Hyper', 'Super'];

  // ======================================================================
  //  Combinaisons : lecture de la config et des événements clavier
  // ======================================================================
  function parseCombo(str) {
    if (typeof str !== 'string' || !str.trim()) throw new Error('combinaison vide');
    var c = { ctrl: false, shift: false, alt: false, key: null };
    str.split('+').map(function (s) { return s.trim(); }).forEach(function (p) {
      var u = p.toLowerCase();
      if (!u) throw new Error('syntaxe invalide « ' + str + ' »');
      if (u === 'ctrl' || u === 'control' || u === 'cmd' || u === 'ctl') c.ctrl = true;
      else if (u === 'maj' || u === 'shift') c.shift = true;
      else if (u === 'alt') c.alt = true;
      else if (['win', 'windows', 'meta', 'super', 'os', 'altgr'].indexOf(u) >= 0) throw new Error('touche « ' + p + ' » non interceptable');
      else {
        if (c.key) throw new Error('deux touches principales dans « ' + str + ' »');
        if (/^f([1-9]|1[0-2])$/.test(u)) c.key = u.toUpperCase();
        else if (/^[a-z0-9]$/.test(u)) c.key = u;
        else if (u === 'tab' || u === 'tabulation') c.key = 'Tab';
        else throw new Error('touche inconnue « ' + p + ' »');
      }
    });
    if (!c.key) throw new Error('aucune touche principale dans « ' + str + ' »');
    return c;
  }

  function keyName(k) { return k.length === 1 ? k.toUpperCase() : k; }

  function comboId(c) {
    var parts = [];
    if (c.ctrl) parts.push('Ctrl');
    if (c.shift) parts.push('Maj');
    if (c.alt) parts.push('Alt');
    parts.push(keyName(c.key));
    return parts.join('+');
  }

  function sameCombo(a, b) {
    return a.ctrl === b.ctrl && a.shift === b.shift && a.alt === b.alt && a.key === b.key;
  }

  /** Traduit un keydown en combinaison. null pour une touche de modification seule. */
  function eventCombo(e) {
    if (MODIFIER_KEYS.indexOf(e.key) >= 0 || e.key === 'Dead' || e.key === 'Unidentified' && !e.code) return null;
    // Alt Gr (AZERTY) arrive comme Ctrl+Alt : on le traite comme tel.
    var altGr = !!(e.getModifierState && e.getModifierState('AltGraph'));

      ctrl: !!(e.ctrlKey || e.metaKey || altGr), // Cmd (Mac) = Ctrl
      shift: !!e.shiftKey,
      alt: !!(e.altKey || altGr),

  }

  // ======================================================================
  //  Vérification de la banque au chargement
  // ======================================================================
  NS.loadConfig = function (raw) {

    }

    var forbidden = {};
    (cfg.forbidden || []).forEach(function (f) {
      try { forbidden[comboId(parseCombo(f))] = true; } catch (e) { /* entrée interdite mal écrite : ignorée */ }
    });
    var seen = {};
    cfg.shortcuts.forEach(function (s, i) {
      var where = 'Entrée n°' + (i + 1) + (s && s.label ? ' « ' + s.label + ' »' : '');
      try {
        if (!s || typeof s.label !== 'string' || !s.label.trim()) throw new Error('libellé manquant');
        if (!cfg.levels || !cfg.levels[s.level]) throw new Error('niveau inconnu « ' + s.level + ' »');
        var list = Array.isArray(s.combos) ? s.combos : [s.combos];
        if (!list.length) throw new Error('aucune combinaison');
        var combos = list.map(parseCombo);
        combos.forEach(function (c) {
          if (forbidden[comboId(c)]) throw new Error(comboId(c) + ' ne peut pas être intercepté par le navigateur');
        });
        var key = s.label.trim().toLowerCase();
        if (seen[key]) throw new Error('libellé en double');
        seen[key] = true;

          label: s.label.trim(),
          level: s.level,
          combos: combos,
          text: combos.map(comboId).join(' puis ')

      } catch (err) {
        excluded.push(where + ' : ' + err.message);
      }

      '<div class="pptg-ribbon">' +

        '<li>Enchaîne les réussites à l\'aveugle pour faire <b>flamber le combo</b> (jusqu\'à ×2).</li>' +
        '</ol>' + touch + problems + excludedNote +
        '<div class="pptg-row">' +
        '<button class="pptg-btn big" data-a="play"' + (loaded.errors.length ? ' disabled' : '') + '>▶ Jouer</button>' +
        (canLock ? '<button class="pptg-btn ghost" data-a="lock" title="Chrome / Edge : capture encore plus de combinaisons">⛶ Plein écran + verrouillage clavier</button>' : '') +
        '</div>' +
        '<div class="pptg-row small">' +
        '<button class="pptg-link" data-a="test">🧪 Tester les raccourcis sur ce navigateur</button>' +
        (opts.onQuit ? '<button class="pptg-link" data-a="quit">✕ Quitter</button>' : '') +
        '</div>' +
        '<div class="pptg-foot">AZERTY et QWERTY · Cmd = Ctrl sur Mac · Échap = pause</div>' +
        '</div>';
      bind(slide, 'play', function () { start(); });
      bind(slide, 'lock', function () { enterLockMode().then(start); });
      bind(slide, 'test', showTest);
      bind(slide, 'quit', function () { if (opts.onQuit) opts.onQuit(); });
    }

    function bind(scope, action, fn) {
      var b = scope.querySelector('[data-a="' + action + '"]');
      if (b) b.addEventListener('click', function (e) { e.preventDefault(); b.blur(); fn(); });
    }

    // ======================================================================
    //  Partie
    // ======================================================================
    function pickQuestions() {
      var list = [];
      cfg.levelOrder.forEach(function (lvl) {
        shuffle(loaded.pools[lvl]).slice(0, cfg.levels[lvl].count).forEach(function (entry) { list.push(entry); });
      });
      return list;
    }

    function start() {
      if (destroyed || loaded.errors.length) return;
      stopLoop();
      questions = pickQuestions();
      qi = -1; score = 0; combo = 1; details = [];
      paused = false; pausedTotal = 0;
      pauseEl.classList.remove('show');
      screen = 'playing';
      setBlocking(true);
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      renderThumbs();
      updateHud();
      nextQuestion();
      raf = requestAnimationFrame(loop);
    }

    function nextQuestion() {
      qi++;
      if (qi >= questions.length) { endGame(); return; }
      var entry = questions[qi];
      var lvl = cfg.levels[entry.level];
      q = {
        entry: entry, coef: lvl.coef, levelLabel: lvl.label,
        phase: 'intro', step: 0, until: now() + cfg.timing.intro * 1000, deadline: 0
      };
      lastTickSec = -1;
      renderQuestion();
      renderThumbs();
      updateHud();
    }

    function startPhase(p) {
      q.phase = p;
      var dur = (p === 'p1' ? cfg.timing.phase1 : cfg.timing.phase2) * 1000;
      q.deadline = now() + dur;
      q.duration = dur;
      lastTickSec = -1;
      slide.classList.remove('intro');
      slide.classList.toggle('revealed', p === 'p2');
      setPhaseText();
      renderNotes(p === 'p2');
      if (p === 'p2') sfx('alarm');
    }

    function loop() {
      if (destroyed || screen !== 'playing') return;
      if (!paused && q) {
        var t = now();
        if (q.phase === 'intro' && t >= q.until) startPhase('p1');
        else if (q.phase === 'p1' || q.phase === 'p2') {
          var left = Math.max(0, q.deadline - t);
          renderTimer(left / q.duration, left / 1000);
          var sec = Math.ceil(left / 1000);
          if (q.phase === 'p2' && sec !== lastTickSec && sec <= 3 && sec > 0) { lastTickSec = sec; sfx('tick'); }
          if (left <= 0) {
            if (q.phase === 'p1') startPhase('p2');
            else miss();
          }
        } else if ((q.phase === 'success' || q.phase === 'missed') && t >= q.until) {
          nextQuestion();
        }
      }
      raf = requestAnimationFrame(loop);
    }
    function stopLoop() { cancelAnimationFrame(raf); raf = 0; }

    // ---------- reconnaissance d'une combinaison ----------
    function handleCombo(c) {
      if (!q || (q.phase !== 'p1' && q.phase !== 'p2')) return;
      var combos = q.entry.combos;
      showTyped(c);
      if (sameCombo(c, combos[q.step])) {
        q.step++;
        if (q.step >= combos.length) succeed();
        else { sfx('pop'); stepDone(); }
        return;
      }
      // mauvaise combinaison : on ne perd pas la question, mais un enchaînement repart du début
      var restart = combos.length > 1 && q.step > 0 && sameCombo(c, combos[0]);
      q.step = restart ? 1 : 0;
      wrong(c);
    }

    function succeed() {
      var left = Math.max(0, q.deadline - now()) / 1000;
      var pts, phase = q.phase, usedCombo = combo;
      if (phase === 'p1') {
        var s1 = cfg.scoring.phase1;
        pts = (s1.base + s1.speed * left / cfg.timing.phase1) * q.coef * combo;
        combo = Math.min(cfg.scoring.comboMax, combo + cfg.scoring.comboStep);
      } else {
        var s2 = cfg.scoring.phase2;
        pts = (s2.base + s2.speed * left / cfg.timing.phase2) * q.coef;
        combo = 1;
        usedCombo = 1;
      }
      pts = Math.round(pts);
      score += pts;
      details.push({
        index: qi + 1, action: q.entry.label, level: q.entry.level, shortcut: q.entry.text,
        result: phase === 'p1' ? 'phase1' : 'phase2', points: pts, combo: usedCombo,
        time: Math.round((q.duration - left * 1000) / 100) / 10
      });
      q.phase = 'success';
      q.until = now() + cfg.timing.afterSuccess * 1000;
      sfx(phase === 'p1' ? 'ding' : 'pop');
      if (phase === 'p1' && combo >= 1.75) sfx('promo');
      renderNotes(true, 'success');
      flash('ok');
      popup('+' + fmt(pts), phase === 'p1' ? (usedCombo > 1 ? 'PARFAIT ! ' + fmtCoef(usedCombo) : 'PARFAIT !') : 'De justesse !');
      renderThumbs();
      updateHud(true);
    }

    function miss() {
      combo = 1;
      details.push({
        index: qi + 1, action: q.entry.label, level: q.entry.level, shortcut: q.entry.text,
        result: 'missed', points: 0, combo: 1, time: null
      });
      q.phase = 'missed';
      q.until = now() + cfg.timing.showAnswer * 1000;
      sfx('error');
      renderTimer(0, 0);
      renderNotes(true, 'missed');
      flash('ko');
      popup('0 pt', 'Raté… la réponse était : ' + q.entry.text);
      renderThumbs();
      updateHud();
    }

    function wrong(c) {
      sfx('error');
      flash('ko');
      slide.classList.remove('shake');
      void slide.offsetWidth;
      slide.classList.add('shake');
      renderNotes(q.phase === 'p2');
    }

    function stepDone() {
      renderNotes(q.phase === 'p2');
      var line = slide.querySelector('.pptg-line');
      if (line) { line.classList.remove('hit'); void line.offsetWidth; line.classList.add('hit'); }
    }

    function togglePause() {
      if (screen !== 'playing') return;
      paused = !paused;
      if (paused) { pauseStart = performance.now(); pauseEl.classList.add('show'); }
      else { pausedTotal += performance.now() - pauseStart; pauseEl.classList.remove('show'); }
    }
    bind(pauseEl, 'resume', togglePause);
    bind(pauseEl, 'abandon', function () { togglePause(); showHome(); });

    function endGame() {
      stopLoop();
      screen = 'end';
      setBlocking(false);
      exitLockMode();
      q = null;
      renderThumbs();
      updateHud();
      renderEnd();
      sfx('win');
      var result = { score: score, details: details.slice() };
      if (typeof opts.onGameEnd === 'function') {
        try { opts.onGameEnd(result); } catch (e) { if (window.console) console.error(e); }
      }
    }

    // ======================================================================
    //  Rendu
    // ======================================================================
    function resetHud() {
      hud.score.textContent = '0';
      hud.combo.textContent = '×1';
      hud.qnum.textContent = '–/10';
      hud.combobox.className = 'pptg-hud-box combo';
      hud.status.textContent = 'Diapositive 1 sur ' + totalQuestions();
    }
    function totalQuestions() {
      return cfg.levelOrder.reduce(function (n, l) { return n + cfg.levels[l].count; }, 0);
    }

    function updateHud(bump) {
      var n = totalQuestions();
      hud.score.textContent = fmt(score);
      hud.combo.textContent = fmtCoef(combo);
      var cur = Math.min(n, Math.max(1, qi + 1));
      hud.qnum.textContent = (screen === 'playing' ? cur : n) + '/' + n;
      hud.status.textContent = 'Diapositive ' + cur + ' sur ' + n + ' · Score ' + fmt(score) + ' · Combo ' + fmtCoef(combo);
      var heat = combo >= 2 ? 'max' : combo >= 1.5 ? 'hot' : combo > 1 ? 'warm' : '';
      hud.combobox.className = 'pptg-hud-box combo ' + heat;
      if (bump) {
        hud.score.classList.remove('bump'); void hud.score.offsetWidth; hud.score.classList.add('bump');
      }
    }

    function renderThumbs() {
      var n = totalQuestions(), out = '';
      for (var i = 0; i < n; i++) {
        var d = details[i];
        var st = d ? d.result : (screen === 'playing' && i === qi ? 'current' : 'todo');
        var lvl = questions[i] ? questions[i].level : cfg.levelOrder[i < 3 ? 0 : i < 7 ? 1 : 2];
        out += '<div class="pptg-thumb ' + st + ' lv-' + lvl + '"><span>' + (i + 1) + '</span><div class="pptg-mini">' +
          (d ? (d.result === 'missed' ? '✕' : '✓') : (st === 'current' ? '…' : '')) + '</div></div>';
      }
      thumbs.innerHTML = out;
    }

    function renderQuestion() {
      var e = q.entry, chain = e.combos.length > 1;
      slide.className = 'pptg-slide play intro lv-' + e.level;
      slide.innerHTML =
        '<div class="pptg-qhead"><span class="pptg-level">' + q.levelLabel + ' · ' + fmtCoef(q.coef) + '</span>' +
        '<span class="pptg-qn">Question ' + (qi + 1) + ' / ' + totalQuestions() + '</span></div>' +
        '<div class="pptg-action">' + esc(e.label) + '</div>' +
        '<div class="pptg-phase"></div>' +
        '<div class="pptg-timer"><i></i><b></b></div>' +
        '<div class="pptg-track' + (chain ? ' chain' : '') + '"><div class="pptg-lanes"></div><div class="pptg-notes"></div><div class="pptg-line"></div>' +
        (chain ? '<div class="pptg-steps"></div>' : '') + '</div>' +
        '<div class="pptg-held"><span class="pptg-cap mod" data-m="ctrl">Ctrl</span><span class="pptg-cap mod" data-m="shift">Maj</span><span class="pptg-cap mod" data-m="alt">Alt</span>' +
        '<span class="pptg-typed">Tape la combinaison…</span></div>' +
        '<div class="pptg-pop"></div>';
      setPhaseText();
      renderTimer(1, cfg.timing.phase1);
      renderNotes(false);
      renderHeld();
    }

    function setPhaseText() {
      var ph = slide.querySelector('.pptg-phase');
      if (!ph) return;
      var chain = q.entry.combos.length > 1;
      if (q.phase === 'intro') ph.innerHTML = 'Prépare-toi…';
      else if (q.phase === 'p1') ph.innerHTML = '🙈 <b>À l\'aveugle</b> · tape le raccourci de mémoire' + (chain ? ' (2 raccourcis, dans l\'ordre)' : '');
      else if (q.phase === 'p2') ph.innerHTML = '🎸 <b>Raccourci révélé</b> · vite, tape-le !';
    }

    function renderTimer(f, secLeft) {
      var t = slide.querySelector('.pptg-timer');
      if (!t) return;
      f = Math.max(0, Math.min(1, f));
      var i = t.querySelector('i');
      i.style.width = (f * 100) + '%';
      // du vert (120°) au rouge (0°)
      i.style.background = 'hsl(' + Math.round(120 * f) + ', 75%, 45%)';
      t.querySelector('b').textContent = secLeft.toFixed(1).replace('.', ',') + ' s';
      t.classList.toggle('urgent', f < 0.3);
    }

    function renderNotes(revealed, outcome) {
      var notes = slide.querySelector('.pptg-notes');
      if (!notes) return;
      var combos = q.entry.combos, chain = combos.length > 1;
      var html = '';
      combos.forEach(function (c, i) {
        var cls = 'pptg-note';
        var offset = (i - q.step) * 96; // le raccourci attendu est sur la ligne, le suivant au-dessus
        if (i < q.step) cls += ' done';
        if (outcome === 'success') cls += ' done';
        if (outcome === 'missed') cls += ' missed';
        if (!revealed) cls += ' blind';
        if (i === q.step && !outcome) cls += ' current';
        var content = revealed ? capsHTML(c) : '<span class="pptg-cap blind">?</span>';
        if (outcome === 'missed') offset = i * 96;
        html += '<div class="' + cls + '" style="bottom:' + (34 + Math.max(0, offset)) + 'px" data-i="' + i + '">' +
          (chain ? '<em>' + (i + 1) + '</em>' : '') + content + '</div>';
      });
      notes.innerHTML = html;
      if (revealed && !outcome && !notes.dataset.fallen) {
        notes.dataset.fallen = '1';
        notes.classList.add('fall'); // les touches « tombent » vers la ligne (une seule fois)
        setTimeout(function () { notes.classList.remove('fall'); }, 900);
      }
      var steps = slide.querySelector('.pptg-steps');
      if (steps) {
        steps.innerHTML = 'Enchaînement : ' + combos.map(function (c, i) {
          var st = (outcome === 'success' || i < q.step) ? 'ok' : (i === q.step && !outcome ? 'now' : '');
          return '<span class="' + st + '">' + (i + 1) + '</span>';
        }).join('<i>→</i>');
      }
      slide.querySelector('.pptg-track').classList.toggle('fast', !!revealed && !outcome);
    }

    function renderHeld() {
      if (screen !== 'playing') return;
      ['ctrl', 'shift', 'alt'].forEach(function (m) {
        var c = slide.querySelector('[data-m="' + m + '"]');
        if (c) c.classList.toggle('on', !!held[m]);
      });
    }

    function showTyped(c) {
      var t = slide.querySelector('.pptg-typed');
      if (!t) return;
      var expected = q.entry.combos[q.step];
      var ok = sameCombo(c, expected);
      t.className = 'pptg-typed ' + (ok ? 'ok' : 'ko');
      t.textContent = comboId(c) + (ok ? ' ✓' : ' ✗');
    }

    function flash(kind) {
      slide.classList.remove('flash-ok', 'flash-ko');
      void slide.offsetWidth;
      slide.classList.add('flash-' + kind);
    }

    function popup(big, small) {
      var p = slide.querySelector('.pptg-pop');
      if (!p) return;
      p.innerHTML = '<b>' + esc(big) + '</b><small>' + esc(small) + '</small>';
      p.classList.remove('show');
      void p.offsetWidth;
      p.classList.add('show');
    }

    // ---------- écran de fin ----------
    function rank(s) {
      if (s >= 25000) return 'Légende du Ctrl+S';
      if (s >= 15000) return 'Virtuose du clavier';
      if (s >= 8000) return 'Ninja du ruban';
      if (s >= 3000) return 'Consultant·e prometteur·se';
      return 'Adepte de la souris';
    }

    function renderEnd() {
      var p1 = details.filter(function (d) { return d.result === 'phase1'; }).length;
      var p2 = details.filter(function (d) { return d.result === 'phase2'; }).length;
      var rows = details.map(function (d) {
        var label = d.result === 'phase1' ? '<span class="pptg-badge p1">Phase 1 · de mémoire</span>'
          : d.result === 'phase2' ? '<span class="pptg-badge p2">Phase 2 · révélé</span>'
            : '<span class="pptg-badge ko">Ratée</span>';
        return '<tr class="lv-' + d.level + '"><td>' + d.index + '</td><td>' + esc(d.action) + '</td><td class="sc">' + esc(d.shortcut) +
          '</td><td>' + label + '</td><td class="pts">' + fmt(d.points) + (d.combo > 1 ? ' <small>' + fmtCoef(d.combo) + '</small>' : '') + '</td></tr>';
      }).join('');
      var extra = (opts.endActions || []).map(function (a, i) {
        return '<button class="pptg-btn ' + (a.primary ? '' : 'ghost') + '" data-x="' + i + '">' + esc(a.label) + '</button>';
      }).join('');
      slide.className = 'pptg-slide end';
      slide.innerHTML =
        '<div class="pptg-end">' +
        '<div class="pptg-end-head"><div><div class="pptg-kicker">Fin de la présentation</div>' +
        '<div class="pptg-end-score">' + fmt(score) + ' <small>points</small></div>' +
        '<div class="pptg-end-rank">' + rank(score) + '</div></div>' +
        '<div class="pptg-end-sum"><span><b>' + p1 + '</b> de mémoire</span><span><b>' + p2 + '</b> révélés</span><span><b>' + (details.length - p1 - p2) + '</b> ratés</span></div></div>' +
        '<table class="pptg-recap"><thead><tr><th>#</th><th>Action</th><th>Raccourci</th><th>Résultat</th><th>Points</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div class="pptg-row"><button class="pptg-btn" data-a="again">↻ Rejouer</button>' + extra + '</div>' +
        '</div>';
      bind(slide, 'again', start);
      slide.querySelectorAll('[data-x]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = opts.endActions[+b.getAttribute('data-x')];
          if (a && a.onClick) a.onClick({ score: score, details: details.slice() });
        });
      });
    }

    // ---------- test des raccourcis ----------
    var testCombos = [];
    function showTest() {
      stopLoop();
      screen = 'test';
      setBlocking(true);
      var seen = {};
      testCombos = [];
      cfg.levelOrder.forEach(function (l) {
        loaded.pools[l].forEach(function (e) {
          e.combos.forEach(function (c) {
            var id = comboId(c);
            if (!seen[id]) { seen[id] = true; testCombos.push({ id: id, c: c, hit: false }); }
          });
        });
      });
      slide.className = 'pptg-slide test';
      slide.innerHTML =
        '<div class="pptg-test"><h2>🧪 Test des raccourcis</h2>' +
        '<p>Tape chaque combinaison. Elle passe au vert quand le jeu l\'a reçue et bloquée. ' +
        'Si le navigateur réagit quand même (nouvel onglet, impression, barre de recherche…), ce raccourci n\'est pas neutralisable ici : retire-le de la banque.</p>' +
        '<div class="pptg-testgrid">' + testCombos.map(function (t, i) { return '<span class="pptg-tchip" data-t="' + i + '">' + t.id + '</span>'; }).join('') + '</div>' +
        '<div class="pptg-typed">Dernière touche : –</div>' +
        '<div class="pptg-row"><button class="pptg-btn ghost" data-a="back">← Retour (Échap)</button></div></div>';
      bind(slide, 'back', showHome);
    }
    function handleTest(c) {
      var id = comboId(c);
      var t = slide.querySelector('.pptg-typed');
      if (t) t.textContent = 'Dernière combinaison reçue et bloquée : ' + id;
      testCombos.forEach(function (tc, i) {
        if (sameCombo(tc.c, c)) {
          tc.hit = true;
          var chip = slide.querySelector('[data-t="' + i + '"]');
          if (chip) chip.classList.add('hit');
        }
      });
      sfx('pop');
    }

    // ======================================================================
    //  API
    // ======================================================================
    function destroy() {
      destroyed = true;
      stopLoop();
      setBlocking(false);
      exitLockMode();
      if (ro) ro.disconnect();
      window.removeEventListener('resize', fit);
      root.removeEventListener('contextmenu', noContext);
      if (root.parentNode) root.parentNode.removeChild(root);
    }

    showHome();
    return { start: start, destroy: destroy, showHome: showHome };
  };

  // exposé pour les tests
  NS._internals = { parseCombo: parseCombo, eventCombo: eventCombo, comboId: comboId, sameCombo: sameCombo };
})();

</script>

<!-- ===== DÉMARRAGE ===== -->
<script>
(function () {
  PptShortcuts.createGame(document.getElementById('app'), {
    onGameEnd: function (result) {
      // Point d'intégration : { score, details: [...] }
      if (window.console) console.log('[Raccourcis Hero · PowerPoint] onGameEnd', result);
    }
  });
})();
</script>
